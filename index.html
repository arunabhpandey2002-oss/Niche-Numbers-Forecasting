<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche Numbers 2.0</title>
<meta name="description" content="Define your model, drive the assumptions, write inputs back.">
<style>
  :root{
    --bg:#f4f6fa;--ink:#172033;--line:#dfe3eb;--line-2:#e7eaf0;--muted:#687189;--muted-2:#7b8398;--eyebrow:#798198;
    --indigo:#4055c7;--indigo-ink:#3448b4;--indigo-mark:#3949ab;--indigo-soft:#edf0ff;--indigo-border:#d8ddfa;
    --green:#12805a;--green-soft:#e8f7f1;--green-dot:#19a974;--green-ring:#e6f7f1;--green-ink:#28735b;
    --red:#c23140;--red-soft:#fff0f1;--amber:#a65d2b;--amber-soft:#fff1e8;--teal:#0b8f9e;--dark:#1b2233;
    --shadow:0 4px 18px rgba(40,52,85,.045);--r:14px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit} h1,h2,h3{margin:0} .num{font-variant-numeric:tabular-nums}
  .topbar{position:sticky;top:0;z-index:10;height:64px;padding:0 32px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:var(--indigo-mark);color:#fff;display:grid;place-items:center}
  .model-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green-dot);box-shadow:0 0 0 3px var(--green-ring)}
  .top-actions{display:flex;gap:8px}
  .btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);transition:.15s}
  .btn:hover{background:#f7f8fb} .btn svg{width:15px;height:15px}
  .btn.sm{height:30px;font-size:12px;padding:0 11px}
  .btn.primary{background:var(--dark);color:#fff;border-color:var(--dark)} .btn.primary:hover{background:#0f1626}
  .btn.indigo{background:var(--indigo);border-color:var(--indigo);color:#fff} .btn.indigo:hover{background:#354aba}
  .btn.ghost{border-style:dashed;color:var(--muted-2)}
  .module-nav{position:sticky;top:64px;z-index:9;height:48px;padding:0 32px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;overflow-x:auto}
  .tabs{display:flex;gap:22px;height:48px}
  .tab{position:relative;display:inline-flex;align-items:center;gap:7px;height:48px;padding:0 3px;border:0;background:0;color:#6c7489;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .tab svg{width:15px;height:15px}
  .tab[data-active="true"]{color:var(--indigo-ink)}
  .tab[data-active="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--indigo)}
  .tab .badge{margin-left:3px;padding:2px 5px;border-radius:5px;background:#eef0f5;color:#8b92a2;font-size:8px;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
  .tab:disabled{cursor:not-allowed;color:#aab0be}
  .page{max-width:1220px;margin:0 auto;padding:26px 32px 80px}
  .eyebrow{text-transform:uppercase;letter-spacing:.1em;color:var(--eyebrow);font-size:10px;font-weight:700;margin:0 0 6px}
  .hero h1{font-size:28px;letter-spacing:-.02em;font-weight:700}
  .hero p{color:var(--muted);margin:8px 0 0;max-width:660px}
  .hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
  .panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .panel-pad{padding:20px 22px}
  .card-heading{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line-2);gap:12px;flex-wrap:wrap}
  .card-heading h2{font-size:16px;letter-spacing:-.015em}
  .mut{color:var(--muted-2)} .fz11{font-size:11px}.fz12{font-size:12px}.fz10{font-size:10px}
  .field{display:grid;gap:5px}
  .field label{color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;font-size:10px;font-weight:700}
  input,select,textarea{font-family:inherit}
  select,.inp{appearance:none;height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 11px;font-size:13px;color:var(--ink)}
  select{background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237b8398' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 9px center;padding-right:28px;cursor:pointer}
  input:focus,select:focus,textarea:focus{outline:2px solid #cdd5f6;outline-offset:0}
  .selrow{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .selrow .arrow{color:#8b93a8;margin-bottom:9px}

  /* builder table */
  .vtbl{width:100%;border-collapse:collapse}
  .vtbl th{text-align:left;background:#f7f8fb;color:#747d92;text-transform:uppercase;letter-spacing:.06em;font-size:9px;padding:8px 12px;font-weight:700}
  .vtbl td{padding:8px 12px;font-size:12px;color:#344056;border-top:1px solid #eef0f4;vertical-align:middle}
  .vtbl tr:hover td{background:#fcfcfe}
  .vtbl tr.row-click{cursor:pointer}
  .vtbl .def-compact{display:flex;flex-direction:column;gap:2px;max-width:340px}
  .vtbl .def-compact .def-line{font-size:11.5px;color:#5a6478;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vtbl .def-compact .def-meta{font-size:10.5px;color:#98a0b2}
  .vtbl .def-compact .expr{font-size:10.5px;color:#7d8598;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:340px}
  .dive-grid{display:grid;grid-template-columns:1fr minmax(160px,1.1fr) 1fr;gap:10px;margin-top:8px;align-items:stretch}
  @media(max-width:860px){.dive-grid{grid-template-columns:1fr}}
  .dive-col{border:1px solid #eef0f4;border-radius:10px;padding:10px 12px;background:#fbfcfe;min-height:80px}
  .dive-col.center{background:#fff;border-color:#d9deea;box-shadow:0 1px 0 rgba(40,52,85,.04)}
  .dive-col h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#747d92}
  .dive-center-name{font-size:16px;font-weight:650;color:#1f2a44;margin:0 0 6px;line-height:1.25}
  .dive-human{font-size:13.5px;color:#2a354d;line-height:1.45;margin:0 0 8px}
  .dive-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .dive-item:hover{background:#fff;border-color:#e5e8ef}
  .dive-item .nm{font-size:12.5px;color:#344056;font-weight:550}
  .dive-item .ky{display:none}
  .dive-empty{font-size:12px;color:#98a0b2;padding:6px 2px}
  .human-expr{font-size:12.5px;color:#2a354d;line-height:1.4}
  .edit-sec{margin:14px 0 0;padding-top:12px;border-top:1px solid #eef0f4}
  .edit-sec:first-of-type{margin-top:4px;padding-top:0;border-top:0}
  .edit-sec-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12px;font-weight:700;color:#3a4763}
  .edit-sec-n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:#eef1f7;color:#5a6478;font-size:11px}
  .plain-box{background:#f4f7fc;border:1px solid #e4eaf5;border-radius:10px;padding:12px 14px;margin-bottom:8px}
  .plain-box .plain-eq{font-size:12px;color:#7d8598;margin:0 0 8px}
  .plain-tier{display:flex;align-items:flex-start;gap:8px;margin:6px 0;font-size:12.5px;color:#2a354d;line-height:1.4}
  .plain-tier .tag{flex:0 0 auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:6px}
  .plain-tier .tag.starter{background:#e8eefc;color:#3b5bcc}
  .plain-tier .tag.pro{background:#e7f6ee;color:#1f6b45}
  .plain-tier .tag.enterprise{background:#f3e9fb;color:#6b3fa0}
  .plain-plus{text-align:center;color:#98a0b2;font-weight:700;font-size:14px;margin:2px 0}
  .plain-total{margin-top:10px;padding:8px 10px;background:#e8eef8;border-radius:8px;font-size:12px;color:#3a4763;font-weight:600}
  .vtbl .def-compact .human-expr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:340px;font-size:12px}
  .tokbar.drivers{gap:5px;margin-top:6px}
  .tokbar.drivers .tok{font-size:11px;padding:4px 8px}
  #vInsertFilter{margin-top:8px;margin-bottom:6px}
  .insert-wrap{max-height:120px;overflow:auto;border:1px solid #eef0f4;border-radius:8px;padding:6px;background:#fff}
  .kind-pill{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px}
  .kind-input{background:var(--indigo-soft);color:var(--indigo-ink)}
  .kind-formula{background:#eef7f2;color:var(--green-ink)}
  .kind-output{background:#fff1e8;color:var(--amber)}

  .mapchip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;border:1px solid transparent}
  .mapchip.auto{background:#eef7f2;color:#1f6b45;border-color:#c9e6d8}
  .mapchip.suggested{background:#fff8ec;color:#8a5a12;border-color:#f4e2c0}
  .mapchip.manual,.mapchip.confirmed{background:var(--indigo-soft);color:var(--indigo-ink);border-color:var(--indigo-border)}
  .mapchip.unmapped{background:#f2f4f8;color:#8b93a6;border-color:#e5e8ef}
  .mapbanner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px;padding:10px 14px;border-radius:10px;background:#fff8ec;border:1px solid #f4e2c0;color:#8a5a12;font-size:12.5px}
  .mapbanner b{font-weight:700}
  .mapfilter{display:inline-flex;gap:4px;flex-wrap:wrap}
  .mapfilter button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;font-size:11px;cursor:pointer;color:#6c7489}
  .mapfilter button.on{background:var(--indigo-soft);border-color:var(--indigo-border);color:var(--indigo-ink);font-weight:600}
  .linechip .gear{margin-left:4px;opacity:.55;font-size:11px;cursor:pointer}
  .linechip.on .gear{opacity:.85}
  .keychip{font-family:var(--mono);font-size:10px;color:#8b93a6;background:#f2f4f8;border-radius:5px;padding:1px 6px}
  .expr{font-family:var(--mono);font-size:11px;color:#3a4763}
  .cellref{font-family:var(--mono);font-size:11px;color:#7d8598}
  .cellref.unmapped{color:#b6bccb;font-style:italic}
  .rowacts{display:flex;gap:6px;justify-content:flex-end}
  .iconbtn{border:1px solid var(--line);background:#fff;border-radius:7px;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;color:#6c7489}
  .iconbtn:hover{background:#f4f6fb}
  .iconbtn svg{width:14px;height:14px}

  .chainwrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#f8f9fc;border-radius:8px;padding:7px 11px;font-size:12px;color:#3a4763}
  .chip.out{background:#eef7f2;border-color:#c9e6d8;color:var(--green-ink);font-weight:600}
  .chip .k{font-family:var(--mono);font-size:9px;color:#98a0b2}
  .chainwrap .arrow{color:#b6bccb}
  .canvas{position:relative;height:520px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;background-image:radial-gradient(#e7eaf1 1px,transparent 1px);background-size:18px 18px;overflow:hidden;touch-action:none;cursor:grab}
  .canvas .links{position:absolute;top:0;left:0;width:4200px;height:2800px;pointer-events:none}
  .canvas .links .edgegrp{pointer-events:auto;cursor:pointer}
  .canvas .links .edgegrp:hover .edge{stroke:#c23140;stroke-width:2.6}
  .canvas .links .edgegrp:hover .hit{stroke:rgba(194,49,64,.07)}
  .node2{position:absolute;min-width:118px;max-width:190px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 10px;box-shadow:0 2px 8px rgba(40,52,85,.08);cursor:grab;user-select:none}
  .node2.formula{border-color:#c9e6d8;background:#f4fbf7} .node2.input{border-color:#d8ddfa;background:#f7f8ff} .node2.output{border-color:#f2d6bf;background:#fff8f1}
  .node2 .nm{font-weight:600;font-size:12px;color:#2b3a55} .node2 .sub{font-family:var(--mono);font-size:9px;color:#8b93a6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .node2 .val{font-size:10px;color:#3a4763;margin-top:3px;font-variant-numeric:tabular-nums}
  .canvas-inner{position:absolute;top:0;left:0;width:4200px;height:2800px;will-change:transform;transform-origin:0 0}
  .pagebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 22px;margin-top:6px}
  .ptab{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--line);border-radius:8px 8px 0 0;border-bottom:0;background:#f7f8fb;color:var(--muted-2);font-size:12px;font-weight:600;cursor:pointer}
  .ptab.on{background:#fff;color:var(--indigo-ink);border-color:var(--indigo-border);box-shadow:0 -2px 0 var(--indigo) inset}
  .ptab .pcount{font-size:9px;background:#e7eaf2;color:#7b8398;border-radius:6px;padding:1px 5px;font-weight:700}
  .ptab.on .pcount{background:var(--indigo-soft);color:var(--indigo-ink)}
  .ptab.add,.ptab.del{border-radius:8px;border-bottom:1px solid var(--line);background:#fff;color:var(--muted-2)}
  .ptab.add:hover,.ptab.del:hover{background:#f2f4f9;color:var(--ink)}
  .opgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .opbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;color:#3a4152}
  .opbtn:hover{border-color:var(--indigo);background:#f6f7ff} .opbtn b{font-size:22px;line-height:1;color:var(--indigo-ink)} .opbtn span{font-size:12px}
  .node2 .handle{position:absolute;right:-8px;top:50%;transform:translateY(-50%);width:15px;height:15px;border-radius:50%;background:var(--indigo);border:2px solid #fff;cursor:crosshair;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .node2 .handle:hover{background:var(--indigo-ink)}
  .node2.dim{opacity:.18;filter:grayscale(.35);box-shadow:none}
  .node2.focus-sel{border-color:var(--indigo)!important;box-shadow:0 0 0 2px var(--indigo),0 4px 14px rgba(64,85,199,.22);z-index:3}
  .node2.focus-near{border-color:#9aa8e8!important;box-shadow:0 2px 10px rgba(64,85,199,.14);z-index:2;opacity:1}
  .canvas .links .edgegrp.dim{opacity:.12;pointer-events:none}
  .canvas .links .edgegrp.focus-edge .edge{stroke:var(--indigo);stroke-width:2.2}
  .vtbl tr.row-click.sel{background:#eef1ff}
  .vtbl tr.row-click.sel td{border-color:#d5dbf5}
  .focuschip{display:none;align-items:center;gap:8px;margin:0 0 10px;padding:8px 12px;border:1px solid var(--indigo-border);background:var(--indigo-soft);border-radius:10px;font-size:12px;color:var(--indigo-ink)}
  .focuschip.on{display:flex;flex-wrap:wrap}

  /* forecasting assumptions */
  .grid-forecast{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
  .asm{padding:16px 0;border-bottom:1px solid #edf0f4}
  .asm:first-child{padding-top:2px} .asm:last-child{border-bottom:0}
  .asm-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
  .asm-head strong{font-size:13px} .asm-head .k{font-family:var(--mono);font-size:9px;color:#98a0b2}
  .asm-base{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .asm-base .inp{height:30px;width:110px;font-size:12px;font-variant-numeric:tabular-nums}
  .asm-base .lab{font-size:11px;color:var(--muted-2)}
  .steps{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
  .stepchip{display:inline-flex;align-items:center;gap:6px;background:#eef0ff;border:1px solid #d8ddfa;color:#3a4680;border-radius:20px;padding:4px 6px 4px 10px;font-size:11px}
  .stepchip .x{cursor:pointer;color:#8791c9;font-weight:700}
  .stepadd{border:1px dashed var(--line);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--muted-2);cursor:pointer;background:#fff}
  .shapechip{display:inline-flex;align-items:center;gap:5px;border:1px solid #d8ddfa;background:#eef0ff;color:#3a4680;border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;font-weight:500}
  .seg{display:inline-flex;background:#eef0f4;border-radius:9px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font:600 12.5px var(--font);color:#6b7385;cursor:pointer}
  .seg button.on{background:#fff;color:#2b3044;box-shadow:0 1px 2px rgba(43,48,68,.12)}
  .sbars{display:flex;align-items:stretch;gap:3px;height:120px;padding:10px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(#fafbff,#fff);touch-action:none;position:relative}
  .sbars .midline{position:absolute;left:10px;right:10px;height:1px;background:#dfe3ee;top:50%;pointer-events:none}
  .sbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:ns-resize;position:relative}
  .sbar i{width:100%;max-width:22px;background:#4055c7;border-radius:3px 3px 0 0;transition:height .02s}
  .sbar span{font-size:8px;color:#98a0b2;margin-top:3px;position:absolute;top:100%}
  /* variance */
  .vgrid{display:grid;grid-template-columns:minmax(430px,1fr) minmax(420px,1.05fr);gap:16px;align-items:start}
  .selrow2{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
  .selrow2 .field label{display:block;font-size:11px;color:var(--muted-2);margin-bottom:4px}
  .selrow2 select{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:12.5px;background:#fff;color:#2b3044}
  .selrow2 .vsvs{padding-bottom:9px;color:#98a0b2;font-size:12px}
  .scrollx{overflow-x:auto}
  .vtable{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
  .vtable th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);color:#7d8599;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  .vtable th.num,.vtable td.num{text-align:right;font-variant-numeric:tabular-nums}
  .vtable td{padding:9px 10px;border-bottom:1px solid #f0f2f6;white-space:nowrap}
  .vrow{cursor:pointer} .vrow:hover{background:#fafbff} .vrow.sel{background:#f2f4ff;box-shadow:inset 3px 0 0 var(--indigo)}
  .vrow.immaterial{opacity:.4} .vrow.immaterial:hover{opacity:.75}
  .rtag{display:inline-block;margin-top:3px;font-size:10px;font-weight:600;color:#7a5b12;background:#fdf3dc;border:1px solid #f2e2b8;border-radius:5px;padding:1px 6px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
  .vreason{display:flex;gap:12px;align-items:flex-end;margin:2px 0 14px;flex-wrap:wrap}
  .vreason .field label{display:block;font-size:11px;color:var(--muted-2);margin-bottom:4px}
  .vreason select{height:36px;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font-size:12.5px;background:#fff;color:#2b3044}
  .vreason .inp{height:36px}
  .rag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle}
  .rag.g{background:#3aa981} .rag.a{background:#e6a44e} .rag.r{background:#d64550} .rag.na{background:#d3d7e0}
  .vmeta{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .explbadge{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:#5a6377;font-weight:500}
  .explbar{display:inline-block;width:64px;height:6px;border-radius:100px;background:#e9ebf1;overflow:hidden}
  .explbar span{display:block;height:100%;background:#3aa981;border-radius:100px}

<script>
/* ============================================================
   NICHE NUMBERS 2.0 — generic model builder
   Variables (input / formula / output) form a graph.
   You edit INPUTS; formulas compute; write-back pushes inputs
   into your sheet's own cells. Nothing hardcoded.
   ============================================================ */

/* ---- time axis ---- */
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function genMonths(n,startM=8,startY=26){ let m=startM,y=startY,out=[]; for(let i=0;i<n;i++){ out.push(MN[m]+" ’"+y); m++; if(m>11){m=0;y++;} } return out; }

/* ---- expression compiler (shunting-yard → RPN) + FP&A helpers ---- */
const NN_FN_ARITY={lag:2, if:3, sum_periods:1, sum:1, pct:2, max:2, min:2};
const NN_FN_VREF=new Set(['lag','sum_periods','sum']); /* first arg is a variable reference */
function compile(expr){
  const toks=(String(expr).match(/[A-Za-z_][A-Za-z0-9_]*|\d+\.?\d*|[(),+\-*/]/g))||[];
  const out=[],ops=[],prec={'+':1,'-':1,'*':2,'/':2};
  const arityStack=[];
  const flushOp=o=>{
    if(typeof o==='object'&&o&&o.fn) return {fn:o.fn, arity:NN_FN_ARITY[o.fn]||o.arity||0};
    return {op:o};
  };
  for(let i=0;i<toks.length;i++){
    const t=toks[i];
    if(/^[\d.]/.test(t)) out.push({n:+t});
    else if(/^[A-Za-z_]/.test(t)){
      const fn=t.toLowerCase();
      if(NN_FN_ARITY[fn]!=null && toks[i+1]==='('){ ops.push({fn}); }
      else out.push({v:t});
    }
    else if(t==='('){
      ops.push(t);
      if(ops.length>=2 && typeof ops[ops.length-2]==='object' && ops[ops.length-2].fn){
        /* peek whether args are empty: next token ) → arity 0 */
        arityStack.push(toks[i+1]===')'?0:1);
      }
    }
    else if(t===','){
      while(ops.length && ops[ops.length-1]!=='(') out.push(flushOp(ops.pop()));
      if(arityStack.length) arityStack[arityStack.length-1]++;
    }
    else if(t===')'){
      while(ops.length && ops[ops.length-1]!=='(') out.push(flushOp(ops.pop()));
      if(ops.length && ops[ops.length-1]==='(') ops.pop();
      if(ops.length && typeof ops[ops.length-1]==='object' && ops[ops.length-1].fn){
        const f=ops.pop(); const expect=NN_FN_ARITY[f.fn];
        const got=arityStack.length?arityStack.pop():expect;
        if(expect!=null && got!==expect) throw new Error(f.fn+'() expects '+expect+' arg(s)');
        out.push({fn:f.fn, arity:expect});
      }
    }
    else {
      while(ops.length && typeof ops[ops.length-1]==='string' && ops[ops.length-1]!=='(' && prec[ops[ops.length-1]]>=prec[t])
        out.push(flushOp(ops.pop()));
      ops.push(t);
    }
  }
  while(ops.length){
    const o=ops.pop();
    if(o==='('||o===')') continue;
    out.push(flushOp(o));
  }
  /* rewrite lag/sum first-arg variables into {vref} so eval keeps the name */
  (function rewriteVrefs(rpn){
    const stack=[];
    for(let i=0;i<rpn.length;i++){
      const x=rpn[i];
      if('n' in x || 'v' in x || 'vref' in x){ stack.push(i); continue; }
      if(x.op){ stack.pop(); stack.pop(); stack.push(i); continue; }
      if(x.fn){
        const args=[]; for(let a=0;a<(x.arity||0);a++) args.unshift(stack.pop());
        if(NN_FN_VREF.has(x.fn) && args[0]!=null && rpn[args[0]] && 'v' in rpn[args[0]])
          rpn[args[0]]={vref:rpn[args[0]].v};
        stack.push(i);
      }
    }
  })(out);
  const deps=[...new Set(out.filter(x=>'v' in x || 'vref' in x).map(x=>x.v||x.vref))];
  return {rpn:out,deps};
}
/* Fixed-scale decimal arithmetic (integer micros at 1e8) for deterministic + - * / */
const NN_SCALE=1e8;
function nnToMicro(n){ const x=Number(n); return Number.isFinite(x)?Math.round(x*NN_SCALE):NaN; }
function nnFromMicro(m){ return Number.isFinite(m)?m/NN_SCALE:NaN; }
/* ctx optional: {period, lookup(key,q)} for lag / sum_periods across time */
function evalRPN(rpn,scope,ctx){
  const st=[];
  const period=(ctx&&ctx.period!=null)?ctx.period:0;
  const lookup=(ctx&&typeof ctx.lookup==='function')?ctx.lookup:(key,q)=>{
    if(q!==period) return 0;
    const raw=scope[String(key).toLowerCase()];
    return raw;
  };
  const pushNum=raw=>{
    if(raw===undefined || raw===null || (typeof raw==='number' && Number.isNaN(raw))) st.push(NaN);
    else st.push(nnToMicro(Number(raw)));
  };
  for(const x of rpn){
    if('n' in x) st.push(nnToMicro(x.n));
    else if('vref' in x) st.push({__ref:x.vref});
    else if('v' in x) pushNum(scope[x.v.toLowerCase()]);
    else if(x.fn){
      const args=[]; for(let i=0;i<(x.arity||0);i++) args.unshift(st.pop());
      if(x.fn==='lag'){
        const ref=args[0], nMicro=args[1];
        const key=ref&&ref.__ref; const n=Math.round(nnFromMicro(nMicro));
        const q=period-n;
        let val=0;
        if(key && q>=0){ const raw=lookup(key,q); if(raw!=null && raw!=='' && !(typeof raw==='number'&&Number.isNaN(raw))) val=Number(raw); }
        st.push(nnToMicro(val));
      } else if(x.fn==='sum_periods' || x.fn==='sum'){
        const ref=args[0]; const key=ref&&ref.__ref; let s=0;
        if(key){ for(let q=0;q<=period;q++){ const raw=lookup(key,q); if(raw!=null && raw!=='' && !(typeof raw==='number'&&Number.isNaN(raw))) s+=Number(raw); } }
        st.push(nnToMicro(s));
      } else if(x.fn==='if'){
        const cond=args[0], a=args[1], b=args[2];
        if(!Number.isFinite(cond)) st.push(NaN);
        else st.push(cond!==0 ? a : b);
      } else if(x.fn==='max'){
        const a=args[0], b=args[1];
        if(!Number.isFinite(a) || !Number.isFinite(b)) st.push(NaN);
        else st.push(Math.max(a,b));
      } else if(x.fn==='min'){
        const a=args[0], b=args[1];
        if(!Number.isFinite(a) || !Number.isFinite(b)) st.push(NaN);
        else st.push(Math.min(a,b));
      } else if(x.fn==='pct'){
        const a=args[0], b=args[1];
        if(!Number.isFinite(a) || !Number.isFinite(b)){ st.push(NaN); continue; }
        if(b===0) throw new Error('Division by zero');
        st.push(Math.round((a*100*NN_SCALE)/b));
      } else st.push(NaN);
    }
    else {
      const b=st.pop(), a=st.pop();
      if(a&&typeof a==='object'&&a.__ref || b&&typeof b==='object'&&b.__ref){ st.push(NaN); continue; }
      if(!Number.isFinite(a) || !Number.isFinite(b)){ st.push(NaN); continue; }
      let r;
      if(x.op==='+') r=a+b;
      else if(x.op==='-') r=a-b;
      else if(x.op==='*') r=Math.round((a*b)/NN_SCALE);
      else if(x.op==='/'){
        if(b===0) throw new Error('Division by zero');
        r=Math.round((a*NN_SCALE)/b);
      } else r=NaN;
      st.push(r);
    }
  }
  if(!st.length) return 0;
  const top=st[st.length-1];
  if(top&&typeof top==='object'&&top.__ref) return NaN;
  return Number.isFinite(top)?nnFromMicro(top):NaN;
}

/* ---- the model ---- */
let model={
  periods:genMonths(12),
  closed:0,
  displayVars:["revenue"],
  chartVar:"revenue",
  levers:null,
  goalseek:"price",
  scenarioName:"Plan",
  versions:[],
  ov:{},
  vars:[
    {key:"price",          name:"Price per unit",        unit:"₹", kind:"input",   base:950, steps:[], delta:0, range:"", writable:true},
    {key:"distributors",   name:"Distributors",          unit:"#", kind:"input",   base:100, steps:[], delta:0, range:"", writable:true},
    {key:"units_per_dist", name:"Units per distributor",  unit:"#", kind:"input",   base:120, steps:[], delta:0, range:"", writable:true},
    {key:"volume",         name:"Volume",                unit:"#", kind:"formula", expr:"distributors * units_per_dist"},
    {key:"revenue",        name:"Net revenue",           unit:"₹", kind:"formula", expr:"price * volume"}
  ]
};
let conn={connected:false,url:"",token:"",scale:1,sheets:[],actualsSsid:"",actualsSheets:[]};
function extractSsid(s){ if(!s) return ""; const m=String(s).match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/); if(m) return m[1]; return String(s).trim().replace(/[^a-zA-Z0-9_-]/g,''); }
let uiTab="setup";

/* ---- A1 range helpers (sheet + column letter + row → full range across periods) ---- */
function colToNum(c){ let n=0; for(const ch of String(c).toUpperCase()) if(ch>='A'&&ch<='Z') n=n*26+(ch.charCodeAt(0)-64); return n; }
function numToCol(n){ let s=""; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
function buildRange(sheet,col,row,span){ if(!sheet||!col||!row) return ""; const c1=colToNum(col); if(!c1) return ""; const c2=c1+Math.max(1,span)-1; const sh=/[^A-Za-z0-9_]/.test(sheet)?`'${sheet}'`:sheet; return `${sh}!${numToCol(c1)}${row}:${numToCol(c2)}${row}`; }
function parseRange(rng){ const m=String(rng||"").match(/^(?:'([^']+)'|([^'!]+))?!?\s*([A-Za-z]+)(\d+)/); if(!m) return {sheet:"",col:"",row:""}; return {sheet:(m[1]||m[2]||"").trim(),col:(m[3]||"").toUpperCase(),row:m[4]||""}; }

/* ============================ P3: sheet formula → model graph ============================ */
function a1ColRow(ref){
  const m=String(ref||'').replace(/\$/g,'').match(/^([A-Za-z]+)(\d+)$/);
  if(!m) return null;
  return {col:m[1].toUpperCase(), row:+m[2], colNum:colToNum(m[1])};
}
/**
 * Expand Excel SUM over a simple A1:A1 range into (A1+A2+…) so totals like
 * Total COGS =SUM(C12:C15) become first-level Drivers (the summed lines).
 * Same-column vertical or same-row horizontal only; rectangular → leave unchanged.
 */
function expandExcelSumRanges(formula){
  let s=String(formula||'');
  const re=/SUM\(\s*(?:'([^']+)'|([A-Za-z_][A-Za-z0-9_]*))?!?(\$?[A-Za-z]+)\$?(\d+)\s*:\s*(?:(?:'([^']+)'|([A-Za-z_][A-Za-z0-9_]*))!)?(\$?[A-Za-z]+)\$?(\d+)\s*\)/gi;
  return s.replace(re, (full, qs1, uq1, c1, r1, qs2, uq2, c2, r2)=>{
    const sh1=(qs1||uq1||'').trim();
    const sh2=(qs2||uq2||'').trim();
    if(sh2 && sh1 && sh1.toLowerCase()!==sh2.toLowerCase()) return full;
    const col1=String(c1).replace(/\$/g,'').toUpperCase();
    const col2=String(c2).replace(/\$/g,'').toUpperCase();
    const row1=+String(r1).replace(/\$/g,'');
    const row2=+String(r2).replace(/\$/g,'');
    const n1=colToNum(col1), n2=colToNum(col2);
    if(!n1||!n2||!row1||!row2) return full;
    const cells=[];
    if(n1===n2){
      const lo=Math.min(row1,row2), hi=Math.max(row1,row2);
      if(hi-lo>80) return full;
      for(let r=lo;r<=hi;r++) cells.push(col1+r);
    } else if(row1===row2){
      const lo=Math.min(n1,n2), hi=Math.max(n1,n2);
      if(hi-lo>40) return full;
      for(let c=lo;c<=hi;c++) cells.push(numToCol(c)+row1);
    } else return full;
    const pref=sh1?( (/[^A-Za-z0-9_]/.test(sh1)?("'"+sh1.replace(/'/g,"''")+"'"):sh1)+'!' ):'';
    return '('+cells.map(a=>pref+a).join('+')+')';
  });
}
/** Tokenize simple Excel-ish formulas: + - * / ( ) , cell refs, Sheet!A1, $A$1, numbers. */
function tokenizeSheetFormula(src){
  let s=String(src||'').trim();
  if(s.startsWith('=')) s=s.slice(1);
  s=expandExcelSumRanges(s);
  const toks=[]; let i=0;
  while(i<s.length){
    const ch=s[i];
    if(/\s/.test(ch)){ i++; continue; }
    if('+-*/(),'.includes(ch)){ toks.push({t:'op', v:ch}); i++; continue; }
    if(/[0-9.]/.test(ch)){
      let j=i+1; while(j<s.length && /[0-9.]/.test(s[j])) j++;
      toks.push({t:'num', v:s.slice(i,j)}); i=j; continue;
    }
    /* Sheet!A1 or 'Sheet Name'!$A$1 or bare $A$1 / A1 */
    if(ch==="'"){
      let j=i+1; while(j<s.length && s[j]!=="'") j++;
      if(j>=s.length){ toks.push({t:'bad', v:s.slice(i)}); break; }
      const sheet=s.slice(i+1,j); j++;
      if(s[j]==='!'){
        j++;
        const m=s.slice(j).match(/^\$?[A-Za-z]+\$?\d+/);
        if(!m){ toks.push({t:'bad', v:s.slice(i)}); break; }
        toks.push({t:'ref', sheet, a1:m[0].replace(/\$/g,'')}); i=j+m[0].length; continue;
      }
      toks.push({t:'bad', v:s.slice(i)}); break;
    }
    /* unquoted Sheet!A1 or A1 / name-like */
    const rest=s.slice(i);
    const sheetRef=rest.match(/^([A-Za-z_][A-Za-z0-9_]*)!(\$?[A-Za-z]+\$?\d+)/);
    if(sheetRef){
      toks.push({t:'ref', sheet:sheetRef[1], a1:sheetRef[2].replace(/\$/g,'')});
      i+=sheetRef[0].length; continue;
    }
    const cell=rest.match(/^\$?[A-Za-z]+\$?\d+/);
    if(cell){
      toks.push({t:'ref', sheet:'', a1:cell[0].replace(/\$/g,'')});
      i+=cell[0].length; continue;
    }
    const ident=rest.match(/^[A-Za-z_][A-Za-z0-9_.]*/);
    if(ident){ toks.push({t:'ident', v:ident[0]}); i+=ident[0].length; continue; }
    toks.push({t:'bad', v:ch}); i++;
  }
  return toks;
}
/**
 * Convert an Excel formula string into a model expr using variable keys.
 * cellMap: { 'A1'|'Sheet!A1' (upper) -> varKey }
 * Returns {ok, expr, deps, unresolved} or {ok:false, reason}.
 * Only allows + - * / ( ) numbers and mapped refs — functions → fail (caller keeps output).
 */
function sheetFormulaToExpr(formula, cellMap, defaultSheet){
  const toks=tokenizeSheetFormula(formula);
  if(!toks.length) return {ok:false, reason:'empty'};
  if(toks.some(t=>t.t==='bad')) return {ok:false, reason:'unsupported token'};
  const EXCEL_FN={IF:'if', SUM:'sum', MAX:'max', MIN:'min'};
  const parts=[]; const deps=[]; const unresolved=[]; const unsupported=[];
  const ds=String(defaultSheet||'').trim();
  for(const t of toks){
    if(t.t==='op'){ parts.push(t.v==='/'?' / ':t.v==='*'?' * ':t.v==='+'?' + ':t.v==='-'?' - ':t.v); continue; }
    if(t.t==='num'){ parts.push(t.v); continue; }
    if(t.t==='ident'){
      const mapped=EXCEL_FN[String(t.v||'').toUpperCase()];
      if(mapped){ parts.push(mapped); continue; }
      unsupported.push(t.v); parts.push(t.v); continue;
    }
    if(t.t==='ref'){
      const cr=a1ColRow(t.a1); if(!cr){ unresolved.push(t.a1); parts.push('?'); continue; }
      const sh=(t.sheet||ds||'').trim();
      /* Sheet-qualified lookup only — bare A1 collapses Pricing/Assumptions/P&L onto one key */
      const keys=[
        (sh?sh+'!':'')+cr.col+cr.row,
        (sh?sh.toUpperCase()+'!':'')+cr.col+cr.row
      ].map(k=>k.toUpperCase());
      let key=null;
      for(const k of keys){ if(cellMap[k]){ key=cellMap[k]; break; } }
      if(!key && sh){
        const want=(sh+'!'+cr.col+cr.row).toUpperCase().replace(/'/g,'');
        for(const mk of Object.keys(cellMap)){
          if(String(mk).toUpperCase().replace(/'/g,'')===want){ key=cellMap[mk]; break; }
        }
      }
      if(!key){ unresolved.push((sh?sh+'!':'')+cr.col+cr.row); parts.push('?'); continue; }
      parts.push(key); deps.push(key); continue;
    }
  }
  if(unsupported.length) return {ok:false, reason:'unsupported fn '+unsupported.join(','), unsupported};
  if(unresolved.length) return {ok:false, reason:'unresolved '+unresolved.join(','), unresolved};
  const expr=parts.join('').replace(/\s+/g,' ').trim();
  try{ compile(expr); }catch(e){ return {ok:false, reason:String(e.message||e)}; }
  return {ok:true, expr, deps:[...new Set(deps)]};
}
/** Build A1→key map for a scanned block: labelCol + first data col for each line row. */
function buildCellMapFromScan(opts){
  /* opts: {sheet, labelCol, firstCol, headerRow, lines:[{name,metric,row,key}] } row is 1-based sheet row */
  const map={}; const sh=String(opts.sheet||'').trim();
  const first=String(opts.firstCol||'B').toUpperCase();
  (opts.lines||[]).forEach(l=>{
    if(!l || !l.key || !l.row) return;
    const a1=first+l.row;
    const k2=(sh?sh+'!'+a1:a1).toUpperCase();
    map[k2]=l.key;
    if(sh) map[(sh.toUpperCase()+'!'+a1).toUpperCase()]=l.key;
  });
  return map;
}
/** Extract cross-sheet / A1 refs from an Excel formula. */
function extractSheetRefs(formula, defaultSheet){
  const toks=tokenizeSheetFormula(formula);
  const ds=String(defaultSheet||'').trim();
  const out=[];
  toks.forEach(t=>{
    if(t.t!=='ref') return;
    const cr=a1ColRow(t.a1); if(!cr) return;
    const sheet=(t.sheet||ds||'').trim();
    out.push({sheet, col:cr.col, row:cr.row, a1:cr.col+cr.row, key:(sheet?sheet+'!':'')+cr.col+cr.row});
  });
  return out;
}
function quoteSheetRange(sheet, a1){
  const sh=String(sheet||'').trim();
  if(!sh) return a1;
  return (/[^A-Za-z0-9_]/.test(sh)?`'${sh.replace(/'/g,"''")}'`:sh)+'!'+a1;
}
function cellId(sheet, a1){ return (String(sheet||'').trim()+'!'+String(a1||'').toUpperCase()).toUpperCase(); }
function keyFromCell(sheet, a1, label){
  const base=slugKey(label||((sheet?sheet+'_':'')+a1));
  return base;
}
/**
 * Walk sheet formulas from seed P&L cells across tabs.
 * Returns {nodes:[{id,sheet,a1,col,row,formula,value,label,kind}], edges, cellMap}
 * Leaves (no formula) → input; cells with formulas → formula.
 */
function lookupGridCell(map, rng){
  if(!map) return null;
  if(map[rng]!=null) return map[rng];
  const norm=s=>String(s||'').replace(/'/g,'').toUpperCase();
  const want=norm(rng);
  const hit=Object.keys(map).find(k=>norm(k)===want);
  return hit!=null?map[hit]:null;
}
function enqueueFormulaDeps(n, nodes, queue, maxNodes){
  if(!n||!n.formula||!String(n.formula).startsWith('=')) return;
  extractSheetRefs(n.formula, n.sheet).forEach(ref=>{
    const id=cellId(ref.sheet, ref.a1);
    if(nodes.has(id)) return;
    if(nodes.size>=maxNodes) return;
    const child={id, sheet:ref.sheet, a1:ref.a1, col:ref.col, row:ref.row, label:'', seed:false, formula:'', value:null, kind:'pending'};
    nodes.set(id, child); queue.push(child);
  });
}
async function hydrateSeedFormulas(seeds){
  const list=(seeds||[]).filter(s=>s&&s.a1);
  if(!list.length) return seeds;
  const ranges=list.map(s=>quoteSheetRange(s.sheet, s.a1));
  let data=null;
  try{ data=await gasReadRanges(ranges,{includeFormulas:true}); }
  catch(e){ data=null; }
  if(!data||!data.formulas){
    return {seeds, formulasAvailable:false, hydrated:0};
  }
  let hydrated=0;
  list.forEach((s,i)=>{
    const rng=ranges[i];
    const row=lookupGridCell(data.formulas, rng) || (data.formulas[rng]);
    const f=String((row&&row[0])||'').trim();
    if(f && f.startsWith('=')){ s.formula=f; hydrated++; }
    const vrow=lookupGridCell(data.values, rng) || ((data.values||{})[rng]);
    if(vrow&&vrow[0]!=null&&vrow[0]!=='') s.value=vrow[0];
  });
  return {seeds:list, formulasAvailable:hydrated>0 || !!data.formulas, hydrated};
}
async function walkFormulaGraph(seeds, opts){
  opts=opts||{};
  const maxNodes=Math.min(200, opts.maxNodes||120);
  const nodes=new Map(); /* id -> node */
  const queue=[];
  (seeds||[]).forEach(s=>{
    if(!s||!s.a1) return;
    const id=cellId(s.sheet, s.a1);
    if(nodes.has(id)) return;
    const known=String(s.formula||'').trim();
    const n={id, sheet:s.sheet||'', a1:String(s.a1).toUpperCase(), col:s.col, row:s.row, label:s.label||'', seed:!!s.seed, formula:known, value:null, kind:known.startsWith('=')?'formula':'pending'};
    nodes.set(id,n); queue.push(n);
    /* Expand seed formulas immediately so Pricing/Assumptions enter the queue even if cell formula read fails later */
    if(n.kind==='formula') enqueueFormulaDeps(n, nodes, queue, maxNodes);
  });
  let guard=0;
  while(queue.length && nodes.size<=maxNodes && guard++<60){
    const batch=queue.splice(0,40);
    const ranges=batch.map(n=>quoteSheetRange(n.sheet, n.a1));
    let data={values:{}, formulas:{}};
    try{ data=await gasReadRanges(ranges,{includeFormulas:true}); }
    catch(e){
      try{ data=await gasReadRanges(ranges,{includeFormulas:false}); }
      catch(e2){ data={values:{}, formulas:{}}; }
    }
    batch.forEach((n,i)=>{
      const rng=ranges[i];
      const valRow=lookupGridCell(data.values, rng);
      const fRow=lookupGridCell(data.formulas, rng);
      const readFormula=String((fRow&&fRow[0])||'').trim();
      const value=(valRow&&valRow[0]!=null&&valRow[0]!=='')?valRow[0]:null;
      if(value!=null) n.value=value;
      /* Prefer live formula read; keep seed/known formula if read is empty */
      if(readFormula){ n.formula=readFormula; }
      if(n.formula && String(n.formula).startsWith('=')){
        n.kind='formula';
        enqueueFormulaDeps(n, nodes, queue, maxNodes);
      } else {
        n.kind='input';
        if(!n.formula) n.formula='';
      }
    });
  }
  /* Best-effort labels: read A{row} on each sheet for node rows */
  const bySheet={};
  [...nodes.values()].forEach(n=>{
    if(!n.row) return;
    const sh=n.sheet||'';
    bySheet[sh]=bySheet[sh]||new Set();
    bySheet[sh].add(n.row);
  });
  for(const sh of Object.keys(bySheet)){
    const rows=[...bySheet[sh]].sort((a,b)=>a-b);
    if(!rows.length) continue;
    const labelRanges=rows.map(r=>quoteSheetRange(sh,'A'+r));
    try{
      const lab=await gasReadRanges(labelRanges,{includeFormulas:false});
      rows.forEach((r,i)=>{
        const rng=labelRanges[i];
        const row=lookupGridCell(lab.values, rng);
        const txt=String((row&&row[0])||'').trim();
        if(!txt) return;
        [...nodes.values()].filter(n=>(n.sheet||'')===sh && n.row===r).forEach(n=>{ if(!n.label) n.label=txt; });
      });
    }catch(e){}
  }
  return {nodes:[...nodes.values()], cellMap:{}};
}

/**
 * Formula-graph ingest (north star):
 * Start from P&L/cash lines with formulas → walk to leaves (inputs) and mid formulas.
 * Day-to-day later only changes inputs; Accept reviews the graph.
 */
async function ingestFormulaGraphFromSheet(opts){
  opts=opts||{};
  if(!conn.connected||!conn.url||!conn.token) throw new Error('Connect a sheet first');
  const ssid=conn.ssid||'';
  /* Prefer a P&L-like tab; fall back to auto-detect / first tab */
  const tabs=(conn.sheets||[]).map(s=>s.name);
  const pnlName=opts.tab||tabs.find(n=>/^p\s*&\s*l$/i.test(String(n).trim()))||tabs.find(n=>/p\s*&\s*l|\bpnl\b|profit|income/i.test(n))||tabs[0]||'';
  let F=null, src={ssid, tab:pnlName, labelCol:'A', headerRow:1, firstCol:'B', months:Math.max(12,P()||12)};
  try{
    const auto=await autoDetectAndRead({ssid, tab:pnlName});
    if(auto&&auto.lines.length){ F=auto; src=Object.assign({}, src, auto.detected, {tab:pnlName||auto.detected.tab}); }
  }catch(e){}
  if(!F){ F=await readSource(src); }
  if(!F.lines.length) throw new Error('No P&L lines found — pick the P&L tab and Scan again');
  const periods=F.headers.map(fmtPeriodLabel).map((h,i)=>h||('P'+(i+1)));
  const firstCol=src.firstCol||'B';
  const sheetName=src.tab||pnlName||'';
  /* Seed: every P&L line that has a formula (or all numeric lines for review) */
  const seeds=[];
  F.lines.forEach(l=>{
    if(!l.row) return;
    const a1=firstCol+l.row;
    seeds.push({sheet:sheetName, a1, col:firstCol, row:l.row, label:l.name||'', seed:true, formula:l.formula||'', value:null});
  });
  /* Always re-read seed cell formulas — scan grid can miss getFormulas; without this P&L lines become false inputs */
  const hyd=await hydrateSeedFormulas(seeds);
  const nSeedForm=seeds.filter(s=>String(s.formula||'').startsWith('=')).length;
  if(!nSeedForm){
    throw new Error('No formulas returned for P&L lines (got values only). Redeploy Apps Script Code.gs with includeFormulas, then Connect & Scan again — do not Accept inputs that should be formulas.');
  }
  const walked=await walkFormulaGraph(seeds, {maxNodes:150});
  const byId=new Map(walked.nodes.map(n=>[n.id,n]));
  seeds.forEach(s=>{
    const id=cellId(s.sheet,s.a1);
    const n=byId.get(id);
    if(!n) return;
    if(s.label) n.label=s.label;
    if(s.formula && String(s.formula).startsWith('=') && (!n.formula || !String(n.formula).startsWith('='))){
      n.formula=s.formula; n.kind='formula';
    }
  });
  /* Second pass: ensure every formula node's deps exist as graph nodes (Pricing/Assumptions). */
  const nodeMap=new Map(walked.nodes.map(n=>[n.id,n]));
  const more=[];
  walked.nodes.forEach(n=>{ if(n.kind==='formula' && n.formula) enqueueFormulaDeps(n, nodeMap, more, 150); });
  if(more.length){
    const moreWalk=await walkFormulaGraph(more.map(n=>({sheet:n.sheet,a1:n.a1,col:n.col,row:n.row,label:n.label||'',formula:'',seed:false})), {maxNodes:150});
    moreWalk.nodes.forEach(n=>{ if(!nodeMap.has(n.id)){ nodeMap.set(n.id,n); walked.nodes.push(n); } });
  }
  /* Assign stable keys */
  const usedK={};
  const uk=name=>{ let k=slugKey(name),b=k,i=2; while(usedK[k]){k=b+'_'+i;i++;} usedK[k]=1; return k; };
  /* Pre-claim Pricing keys so P&L never steals revenue / revenue_total_net */
  model.vars.forEach(v=>{ if(v&&v.srcPricing&&v.key) usedK[v.key]=1; });
  walked.nodes.forEach(n=>{
    const sheetBit=String(n.sheet||'sheet').replace(/[^A-Za-z0-9]+/g,'_');
    const labelBit=n.label||n.a1;
    /* Always sheet-prefixed for non-ambiguous graph identity */
    n.key=uk(sheetBit+'_'+labelBit);
  });
  const cellMap={};
  walked.nodes.forEach(n=>{
    const a1=n.a1.toUpperCase();
    const sh=String(n.sheet||'').trim();
    if(sh){
      cellMap[(sh+'!'+a1).toUpperCase()]=n.key;
      cellMap[(sh.toUpperCase()+'!'+a1).toUpperCase()]=n.key;

  const graphKeys=new Set(walked.nodes.map(n=>n.key));
  const seedNames=new Set(seeds.map(s=>nrm(s.label||'')));
  const keep=model.vars.filter(v=>{
    if(v.srcLine||v.srcGraph||v.srcPricing) return false;
    if(v.kind==='output'&&v.account!=null) return false;
    if(graphKeys.has(v.key)) return false;
    if(seedNames.has(nrm(v.name||''))||seedNames.has(nrm(v.account||''))) return false;

      range:range||'', sheetFormula:n.formula||'', srcGraph:true, srcLine:!!n.seed,

  model.periods=periods;
  model.sources=Object.assign({}, model.sources, {forecast:src, graph:true});
  model.uiState=model.uiState||{};
  model.uiState.scanCatalog=newVars.filter(v=>v.range).map(v=>{
    const rp=parseRange(v.range);
    return {name:v.name, metric:v.metric||'', row:+rp.row||0, sheet:rp.sheet||'', firstCol:rp.col||firstCol, range:v.range, id:nrm(v.metric||'')+'|'+nrm(v.name||'')};
  });
  model.uiState.scanMeta={sheet:sheetName, firstCol, months:periods.length, mode:'formula-graph'};
  model.uiState.graphIngestVersion=GRAPH_INGEST_VERSION;
  model.uiState.scanActualsCatalog=model.uiState.scanActualsCatalog||[];
  {
    const pnl=pickPnlDisplayKeys(newVars);
    if(pnl.length) model.displayVars=pnl;
    else if(!model.displayVars||!model.displayVars.filter(k=>vget(k)).length){
      const sub=newVars.find(v=>/subscription\s*revenue/i.test(v.name));
      model.displayVars=[(sub||newVars.find(v=>v.srcLine&&v.kind==='formula')||newVars[0]||{}).key].filter(Boolean);
    }
  }
  /* Graph owns P&L Net revenue — kill Pricing alias + any Pricing→P&L row maps */
  try{
    if(typeof pricing==='object' && pricing){ pricing.link_revenue=false; if(typeof savePricing==='function') savePricing(); }
  }catch(e){}
  recompileAll(); saveModel();
  if(!model.uiState.scanCatalog.length) throw new Error('Formula graph produced no mapped cells');
  /* Gate: formula seeds must not become Inputs. Zero-dep non-proof lines stay Suggested (SUM/% etc.); hard-fail only the proof walk. */
  const seedFormulaLabels=new Set(seeds.filter(s=>String(s.formula||'').startsWith('=')).map(s=>nrm(s.label||'')));
  const isProofLine=v=>{
    const nm=nrm(v.name||''), ac=nrm(v.account||'');
    return /subscription\s*revenue/.test(nm)||/subscription\s*revenue/.test(ac)||nm==='net revenue'||ac==='net revenue';
  };
  const fakeInputs=[];
  const zeroDepProof=[];
  newVars.forEach(v=>{
    if(!v.srcLine) return;
    const hadFormula=seedFormulaLabels.has(nrm(v.name||''))||seedFormulaLabels.has(nrm(v.account||''));
    if(!hadFormula) return;
    if(v.kind!=='formula' || !String(v.sheetFormula||'').startsWith('=')){
      fakeInputs.push(v.name||v.key); return;
    }
    let deps=0; try{ deps=(compile(v.expr||'').deps||[]).length; }catch(e){ deps=0; }
    if(deps<1){
      if(isProofLine(v)) zeroDepProof.push(v.name||v.key);
      else {
        v.mapStatus='suggested';
        v.classifyNote=v.classifyNote||'Sheet formula kept; feeders not fully resolved yet — Accept after review';
        if(!v.expr) v._suggestedExpr=String(v.sheetFormula||'').replace(/^[=\s]+/,'').trim();
        nSug++;
      }
    }
  });
  if(fakeInputs.length){
    throw new Error('Proof failed: formula P&L/cash lines landed as fake Inputs (no walk): '+fakeInputs.slice(0,8).join(', ')+(fakeInputs.length>8?'…':'')+'. Redeploy Apps Script includeFormulas if needed, Clear all, Connect & Scan.');
  }
  if(zeroDepProof.length){
    throw new Error('Proof failed: Subscription revenue / Net revenue have 0 deps (feeders not materialized): '+zeroDepProof.join(', ')+'. Check Pricing/Assumptions refs in the sheet formulas.');
  }
  const proofVar=newVars.find(v=>/subscription\s*revenue/i.test(v.name))||newVars.find(v=>nrm(v.name||'')==='net revenue');
  let proofDeps=0;
  if(proofVar&&proofVar.expr){ try{ proofDeps=(compile(proofVar.expr).deps||[]).length; }catch(e){ proofDeps=0; } }
  if(proofVar && (!proofVar.expr || proofDeps<1)){
    throw new Error('Proof failed: '+(proofVar.name||'Subscription revenue')+' did not resolve feeders from the sheet formula. Clear all → Connect & Scan after confirming the P&L cell formula references Pricing/Assumptions.');
  }
  return {
    newLines:newVars.length, keep:keep.length, keepMatched:0,
    catalog:model.uiState.scanCatalog.length, formulas:nForm, inputs:nIn, suggested:nSug,
    name:F.name||sheetName, mode:'formula-graph',
    proof: proofVar?proofVar.key:'',
    proofKind: proofVar?proofVar.kind:'',
    proofDeps,
    formulaSeeds: seedFormulaLabels.size

}

/* ---- P3 exact algebraic breakback for pure * / monomial trees ---- */
/** Walk compiled deps; return {ok, exponents:{leafKey:power}, constant} such that
 *  output ≈ constant * Π leaf^power  at the given period (using current scenario values),
 *  or ok:false if + / if / non-monomial. */
function monomialFactorization(key, period, leafKeys){
  const leafSet=new Set((leafKeys||[]).map(k=>String(k).toLowerCase()));
  const memo={};
  function fac(k, seen){
    const kl=String(k).toLowerCase();
    if(kl in memo) return memo[kl];
    if(seen.has(kl)) return memo[kl]={ok:false};
    seen=new Set(seen); seen.add(kl);
    const v=vget(k)||model.vars.find(x=>x.key.toLowerCase()===kl);
    if(!v) return memo[kl]={ok:false};
    if(v.kind==='input'){
      if(!leafSet.has(v.key.toLowerCase()) && !leafSet.has(kl)){
        /* treat as constant at this period */
        const val=inputVal(v,period,true);
        return memo[kl]={ok:true, exp:{}, c:Number(val)};
      }
      const exp={}; exp[v.key]=1;
      return memo[kl]={ok:true, exp, c:1};
    }
    if(v.kind==='output'){
      const val=(v.read&&v.read[period])||0;
      return memo[kl]={ok:true, exp:{}, c:Number(val)};
    }
    if(v.kind!=='formula') return memo[kl]={ok:false};
    let expr=String(v.expr||'').trim();
    if(!expr) return memo[kl]={ok:false};
    let compiled; try{ compiled=v.compiled&&v.compiled.rpn?v.compiled:compile(expr); }catch(e){ return memo[kl]={ok:false}; }
    /* evaluate RPN structurally for monomials only */
    const st=[];
    for(const x of compiled.rpn){
      if('n' in x){ st.push({ok:true, exp:{}, c:x.n}); continue; }
      if('vref' in x) return memo[kl]={ok:false}; /* lag/sum not monomial-closed-form */
      if('v' in x){ st.push(fac(x.v, seen)); continue; }
      if(x.fn) return memo[kl]={ok:false};
      if(x.op){
        const b=st.pop(), a=st.pop();
        if(!a||!b||!a.ok||!b.ok) return memo[kl]={ok:false};
        if(x.op==='*' ){
          const exp={}; Object.keys(a.exp).forEach(k=>exp[k]=(exp[k]||0)+a.exp[k]);
          Object.keys(b.exp).forEach(k=>exp[k]=(exp[k]||0)+b.exp[k]);
          st.push({ok:true, exp, c:a.c*b.c}); continue;
        }
        if(x.op==='/'){
          if(Math.abs(b.c)<1e-15) return memo[kl]={ok:false};
          const exp={}; Object.keys(a.exp).forEach(k=>exp[k]=(exp[k]||0)+a.exp[k]);
          Object.keys(b.exp).forEach(k=>exp[k]=(exp[k]||0)-b.exp[k]);
          st.push({ok:true, exp, c:a.c/b.c}); continue;
        }
        /* + or - : only if one side has no free leaf exponents (pure constant) */
        const aFree=Object.keys(a.exp).some(k=>Math.abs(a.exp[k])>1e-12);
        const bFree=Object.keys(b.exp).some(k=>Math.abs(b.exp[k])>1e-12);
        if(x.op==='+' || x.op==='-'){
          if(aFree&&bFree) return memo[kl]={ok:false};
          if(!aFree&&!bFree){ st.push({ok:true, exp:{}, c:x.op==='+'?a.c+b.c:a.c-b.c}); continue; }
          return memo[kl]={ok:false};
        }
        return memo[kl]={ok:false};
      }
    }
    if(st.length!==1||!st[0].ok) return memo[kl]={ok:false};
    return memo[kl]=st[0];
  }
  const r=fac(key, new Set());
  if(!r||!r.ok) return {ok:false};
  /* drop zero exponents */
  const exp={}; Object.keys(r.exp).forEach(k=>{ if(Math.abs(r.exp[k])>1e-12) exp[k]=r.exp[k]; });
  return {ok:true, exponents:exp, constant:r.c};
}
function tryExactBacksolve(key, period, target, leaves, mode){
  const leafKeys=leaves.map(v=>v.key);
  const fac=monomialFactorization(key, period, leafKeys);
  if(!fac.ok) return {ok:false};
  const cur=leaves.map(v=>stableCur(v,period));
  if(cur.some(x=>!(Math.abs(x)>1e-15))) return {ok:false}; /* zero leaf — can't scale */
  leaves.forEach((v,i)=>setOv(v.key,period,cur[i])); /* stable base before ratio */
  /* Prefer ratio method: y_new / y_old = Π (x_i'/x_i)^{p_i} */
  const y0=outAt(key,period);
  if(!(Math.abs(y0)>1e-15)) return {ok:false};
  const ratio=target/y0;
  if(!Number.isFinite(ratio)) return {ok:false};
  const powers=leaves.map(v=>fac.exponents[v.key]||0);
  if(powers.every(p=>Math.abs(p)<1e-12)) return {ok:false};
  if(mode==='single'){
    const i=0; /* freeLeavesOf already narrowed to one */
    const p=powers[i];
    if(Math.abs(p)<1e-12) return {ok:false};
    /* (x'/x)^p = ratio → x' = x * ratio^(1/p) */
    let scale=Math.pow(ratio, 1/p);
    if(!Number.isFinite(scale)) return {ok:false};
    setOv(leaves[i].key, period, cur[i]*scale);
    let y=outAt(key,period);
    /* FP polish: one corrective scale on the free leaf */
    if(Math.abs(y)>1e-15 && Math.abs(y-target)>Math.max(1e-9, Math.abs(target)*1e-12)){
      const corr=Math.pow(target/y, 1/p);
      if(Number.isFinite(corr)){ setOv(leaves[i].key, period, cur[i]*scale*corr); scale*=corr; y=outAt(key,period); }
    }
    const ok=Math.abs(y-target)<=Math.max(1e-4, Math.abs(target)*1e-6);
    return {ok:true, exact:true, y, hit:ok};
  }
  /* proportional: common factor r on every free leaf → ratio = r^{Σ p_i} */
  const psum=powers.reduce((s,p)=>s+p,0);
  if(Math.abs(psum)<1e-12) return {ok:false};
  let r=Math.pow(ratio, 1/psum);
  if(!Number.isFinite(r)) return {ok:false};
  leaves.forEach((v,i)=>setOv(v.key, period, cur[i]*r));
  let y=outAt(key,period);
  if(Math.abs(y)>1e-15 && Math.abs(y-target)>Math.max(1e-9, Math.abs(target)*1e-12)){
    const corr=Math.pow(target/y, 1/psum);
    if(Number.isFinite(corr)){ r*=corr; leaves.forEach((v,i)=>setOv(v.key, period, cur[i]*r)); y=outAt(key,period); }
  }
  const ok=Math.abs(y-target)<=Math.max(1e-4, Math.abs(target)*1e-6);
  return {ok:true, exact:true, y, hit:ok, scale:r};
}


function P(){ return model.periods.length; }
function vget(k){ return model.vars.find(v=>v.key===k); }
function inputs(){ return model.vars.filter(v=>v.kind==="input"); }
function formulas(){ return model.vars.filter(v=>v.kind==="formula"); }
function outputs(){ return model.vars.filter(v=>v.kind==="output"); }
function recompileAll(){ formulas().forEach(v=>{ try{ v.compiled=compile(v.expr); v.err=""; }catch(e){ v.compiled={rpn:[],deps:[]}; v.err=String(e);} }); }

/* baseline level of an input over time: a RAMP (start→target over N months) OR
   base + forward-filled step changes. */
function levelArray(v){
  const n=P();
  if(v.ramp && v.ramp.on){
    const r=v.ramp, s=Math.max(0,Math.min(n-1,r.start|0)), m=Math.max(1,r.months|0),
      from=(r.from!=null?r.from:0), to=(r.to!=null?r.to:v.base);
    const arr=new Array(n);
    for(let p=0;p<n;p++){ arr[p]= p<s?from : p>=s+m?to : from+(to-from)*((p-s+1)/m); }
    return arr;
  }
  const arr=new Array(n).fill(v.base);
  (v.steps||[]).slice().sort((a,b)=>a.from-b.from).forEach(st=>{ for(let p=st.from;p<n;p++) arr[p]=st.value; });
  return arr;
}
/* SEASONALITY: a per-period multiplier around the level (default 1.0). value = level × phase. */
function schedule(v){
  const n=P();
  let arr=levelArray(v);
  if(v.phase && v.phase.length){ arr=arr.map((x,p)=> x*(v.phase[p]!=null?v.phase[p]:1)); }
  return arr;
}
function hasShape(v){ return (v.ramp&&v.ramp.on) || (v.phase&&v.phase.some(x=>Math.abs((x==null?1:x)-1)>1e-6)); }
/* scenario overrides are ANCHORS: model.ov[key][period] = value you dragged that month to.
   An anchor carries FORWARD — every later month keeps the baseline's own month-to-month
   movement but re-based to the dragged level (additive shift):
     scenario[q] = anchorValue + (baseline[q] - baseline[anchorPeriod])   for q >= anchorPeriod
   Flat baseline → the level just holds; a rising baseline keeps rising from the new level. */
function inputVal(v,p,scenario){
  const sched=schedule(v);
  if(scenario && model.ov && model.ov[v.key]){
    let a=-1; for(const k in model.ov[v.key]){ const ap=+k; if(ap<=p && ap>a) a=ap; }
    if(a>=0) return model.ov[v.key][a] + (sched[p]-sched[a]);
  }
  return sched[p];
}
function setOv(key,p,val){ if(!model.ov) model.ov={}; if(!model.ov[key]) model.ov[key]={}; model.ov[key][p]=+(+val).toFixed(4); }
function delOv(key,p){ if(model.ov&&model.ov[key]){ delete model.ov[key][p]; if(!Object.keys(model.ov[key]).length) delete model.ov[key]; } }
function hasOv(key){ return model.ov&&model.ov[key]&&Object.keys(model.ov[key]).length; }
function clearScenario(){ model.ov={}; renderAssumptions(); renderForecast(); saveModel(); }
/* Deterministic Kahn topological order among formulas (formula→formula edges only). */
function formulaTopoOrder(){
  const fs=formulas();
  const keys=new Set(fs.map(v=>v.key.toLowerCase()));
  const indeg={}, adj={}, byKey={};
  fs.forEach(v=>{ const k=v.key.toLowerCase(); byKey[k]=v; indeg[k]=0; adj[k]=[]; });
  fs.forEach(v=>{
    const k=v.key.toLowerCase();
    (v.compiled?.deps||[]).forEach(d=>{
      const dk=d.toLowerCase();
      if(keys.has(dk)){ adj[dk].push(k); indeg[k]=(indeg[k]||0)+1; }
    });
  });
  // deterministic: always dequeue the lexicographically smallest ready key
  const ready=Object.keys(indeg).filter(k=>indeg[k]===0).sort();
  const order=[];
  while(ready.length){
    const u=ready.shift();
    order.push(byKey[u]);
    (adj[u]||[]).forEach(w=>{
      indeg[w]--;
      if(indeg[w]===0){
        let i=0; while(i<ready.length && ready[i]<w) i++;
        ready.splice(i,0,w);
      }
    });
  }
  const ordered=new Set(order.map(v=>v.key.toLowerCase()));
  const leftover=fs.filter(v=>!ordered.has(v.key.toLowerCase()));
  return {order, leftover};
}
/* evaluate the whole graph, per period. scenario=true applies per-period input overrides */
function evalModel(scenario){
  const n=P(), res={};
  model.vars.forEach(v=>{ res[v.key]=new Array(n).fill(0); if(v.kind==='formula') v.err=''; });
  const {order, leftover}=formulaTopoOrder();
  leftover.forEach(v=>{ v.err=v.err||'Circular or unresolved dependency'; });
  for(let p=0;p<n;p++){
    const scope={};
    inputs().forEach(v=>{ const val=inputVal(v,p,scenario); scope[v.key.toLowerCase()]=val; res[v.key][p]=val; });
    outputs().forEach(v=>{ const val=(v.read&&v.read[p])||0; scope[v.key.toLowerCase()]=val; res[v.key][p]=val; });
    order.forEach(v=>{
      const deps=v.compiled?.deps||[];
      const missing=deps.filter(d=>!(d.toLowerCase() in scope));
      if(missing.length){
        v.err='Missing dependency: '+missing.join(', ');
        res[v.key][p]=NaN;
        scope[v.key.toLowerCase()]=NaN;
        return;
      }
      try{
        const val=evalRPN(v.compiled.rpn, scope, {period:p, lookup:(key,q)=>{
          if(q<0||q>=n) return 0;
          const sk=String(key).toLowerCase();
          if(q===p && (sk in scope)) return scope[sk];
          const kk=Object.keys(res).find(x=>x.toLowerCase()===sk);
          if(!kk) return 0;
          const raw=res[kk][q];
          return raw==null?0:raw;
        }});
        if(Number.isNaN(val)){ v.err=v.err||'Evaluation produced NaN'; }
        scope[v.key.toLowerCase()]=val;
        res[v.key][p]=val;
      }catch(e){
        v.err=String(e.message||e);
        res[v.key][p]=NaN;
        scope[v.key.toLowerCase()]=NaN;
      }
    });
    leftover.forEach(v=>{ res[v.key][p]=NaN; scope[v.key.toLowerCase()]=NaN; });
  }
  return res;
}

function pricingNum(x){ const n=Number(x); return Number.isFinite(n)?n:0; }

/** Progressive tier revenue for quantity qty. up_to null = open-ended. */
function tierListRevenue(qty, tiers){
  let remaining = Math.max(0, pricingNum(qty));
  let prevCap = 0;
  let total = 0;
  const rows = Array.isArray(tiers) ? tiers : [];
  for(let i=0;i<rows.length;i++){
    if(remaining<=0) break;
    const t=rows[i]||{};
    const price=pricingNum(t.price);
    const cap = (t.up_to==null || t.up_to==='') ? Infinity : pricingNum(t.up_to);
    const band = Math.max(0, (cap===Infinity?remaining:cap) - prevCap);
    const take = Math.min(remaining, band);
    total += take * price;
    remaining -= take;
    if(cap!==Infinity) prevCap = cap;
  }
  return total;
}
function computePricing(period){
  const p = (period==null ? (typeof pricingUI!=='undefined' && pricingUI.period!=null ? pricingUI.period : 0) : period)|0;
  const seatsVar=vget('paying_seats'), usageVar=vget('usage_units');
  const paying = Math.max(0, seatsVar && typeof inputVal==='function' ? pricingNum(inputVal(seatsVar,p,true)) : pricingNum(pricing.paying_seats));
  const usageQty = Math.max(0, usageVar && typeof inputVal==='function' ? pricingNum(inputVal(usageVar,p,true)) : pricingNum(pricing.usage_units));
  const seatDiscVar=vget('seat_discount_pct'), usageDiscVar=vget('usage_discount_pct');
  const contractVar=vget('contract_discount_pct'), promoVar=vget('promo_discount_pct'), flatVar=vget('discount_amount');
  const seat_disc = pricingPct(seatDiscVar && typeof inputVal==='function' ? inputVal(seatDiscVar,p,true) : pricing.seat_discount_pct);
  const usage_disc = pricingPct(usageDiscVar && typeof inputVal==='function' ? inputVal(usageDiscVar,p,true) : pricing.usage_discount_pct);
  const contract_discount_pct = pricingPct(contractVar && typeof inputVal==='function' ? inputVal(contractVar,p,true) : pricing.contract_discount_pct);
  const promo_discount_pct = pricingPct(promoVar && typeof inputVal==='function' ? inputVal(promoVar,p,true) : pricing.promo_discount_pct);
  const discount_amount = pricingNum(flatVar && typeof inputVal==='function' ? inputVal(flatVar,p,true) : pricing.discount_amount);

  const seat_list = tierListRevenue(paying, pricing.seat_tiers);
  const usage_list = tierListRevenue(usageQty, pricing.usage_tiers);
  const list_revenue = seat_list + usage_list;
  const seat_net = seat_list * (1 - seat_disc);
  const usage_net = usage_list * (1 - usage_disc);
  let after = seat_net + usage_net;
  after = after * (1 - contract_discount_pct);
  after = after * (1 - promo_discount_pct);
  after = after - discount_amount;
  const revenue_total_net = Math.max(0, after);
  const revenue_seats_net = seat_net;
  const revenue_usage_net = usage_net;
  const arpu = paying > 0 ? (revenue_total_net / paying) : 0;
  const effective_discount_pct = list_revenue > 0 ? (1 - (revenue_total_net / list_revenue)) : 0;
  return {
    period:p, paying_seats: paying, usage_units: usageQty,
    seat_list, usage_list, list_revenue,
    seat_discount_pct: seat_disc, usage_discount_pct: usage_disc,
    seat_net, usage_net, contract_discount_pct, promo_discount_pct, discount_amount,
    revenue_seats_net, revenue_usage_net, revenue_total_net, arpu, effective_discount_pct
  };
}
function upsertPricingVar(spec){
  let v = vget(spec.key);
  /* Never steal P&L/cash graph lines or cells that still carry a sheet formula */
  if(v && (v.srcGraph || v.srcLine || (v.sheetFormula && String(v.sheetFormula).startsWith('=')))) return v;
  if(!v){
    v = Object.assign({steps:[], delta:0, range:'', writable:!!spec.writable, mapStatus:(spec.range?'auto':'unmapped'), group:'Pricing', srcPricing:true}, spec);
    model.vars.push(v);
  } else {
    v.name = spec.name; v.unit = spec.unit; v.kind = spec.kind; v.group = 'Pricing'; v.srcPricing = true;
    if(spec.kind==='input'){ v.writable = spec.writable!==false; v.base = spec.base; if(spec.expr!=null) delete v.expr; }
    if(spec.kind==='formula'){ v.expr = spec.expr; }
    /* Pricing drivers must not keep stale P&L row maps from legacy label-match */
    if(v.range && /p\s*&\s*l|pnl/i.test(String(v.range))){ v.range=''; v.mapStatus='unmapped'; }
  }
  demoteConfirmedWithoutRange(v);
  return v;
}
/** Keep Pricing drivers first-class in the shared model graph ( forecaster / X-ray / scenarios ). */
function pricingSeedAllowed(){
  return !!(pricing && pricing.seedInModel) || uiTab==='pricing';
}
function enablePricingSeed(){

function disablePricingSeed(opts){

  pricing.seedInModel=false;
  pricing.link_revenue=false;
  try{savePricing();}catch(e){}
  if(strip && model.vars && model.vars.length){
    const before=model.vars.length;
    model.vars=model.vars.filter(v=>!(v&&v.srcPricing));
    if(model.vars.length!==before){
      const gone=new Set(['paying_seats','usage_units','seat_list','usage_list','list_revenue','seat_discount_pct','usage_discount_pct','contract_discount_pct','promo_discount_pct','discount_amount','revenue_seats_net','revenue_usage_net','pricing_after_contract','pricing_after_promo','revenue_total_net','arpu','effective_discount_pct']);
      if(Array.isArray(model.displayVars)) model.displayVars=model.displayVars.filter(k=>k&&!gone.has(k));
    }
  }
}
function syncPricingDrivers(){
  if(!pricingSeedAllowed()) return null;
  if(uiTab==='pricing') enablePricingSeed();
  const n=P();
  const seatSeries=[], usageSeries=[];
  for(let p=0;p<n;p++){
    const c=computePricing(p);
    seatSeries.push(c.seat_list);
    usageSeries.push(c.usage_list);
  }
  const c0=computePricing(pricingUI.period|0);

  upsertPricingVar({key:'paying_seats', name:'Paying seats', unit:'#', kind:'input', base:pricingNum(pricing.paying_seats), writable:true});
  upsertPricingVar({key:'usage_units', name:'Usage units', unit:'#', kind:'input', base:pricingNum(pricing.usage_units), writable:true});
  upsertPricingVar({key:'seat_discount_pct', name:'Seat line discount', unit:'%', kind:'input', base:pricingPct(pricing.seat_discount_pct), writable:true});
  upsertPricingVar({key:'usage_discount_pct', name:'Usage line discount', unit:'%', kind:'input', base:pricingPct(pricing.usage_discount_pct), writable:true});
  upsertPricingVar({key:'contract_discount_pct', name:'Contract discount', unit:'%', kind:'input', base:pricingPct(pricing.contract_discount_pct), writable:true});
  upsertPricingVar({key:'promo_discount_pct', name:'Promo discount', unit:'%', kind:'input', base:pricingPct(pricing.promo_discount_pct), writable:true});
  upsertPricingVar({key:'discount_amount', name:'Flat discount amount', unit:'₹', kind:'input', base:pricingNum(pricing.discount_amount), writable:true});

  /* Tier outputs as scheduled inputs so period seat/usage overrides flow through the graph */
  const seatList=upsertPricingVar({key:'seat_list', name:'Seat list revenue', unit:'₹', kind:'input', base:seatSeries[0]||0, writable:false});
  const usageList=upsertPricingVar({key:'usage_list', name:'Usage list revenue', unit:'₹', kind:'input', base:usageSeries[0]||0, writable:false});
  seatList.steps=[]; usageList.steps=[];
  for(let p=1;p<n;p++){
    if(Math.abs((seatSeries[p]||0)-(seatSeries[p-1]||0))>1e-9) seatList.steps.push({from:p,value:seatSeries[p]});
    if(Math.abs((usageSeries[p]||0)-(usageSeries[p-1]||0))>1e-9) usageList.steps.push({from:p,value:usageSeries[p]});
  }

  upsertPricingVar({key:'list_revenue', name:'List revenue', unit:'₹', kind:'formula', expr:'seat_list + usage_list'});
  upsertPricingVar({key:'revenue_seats_net', name:'Seats net (after line discount)', unit:'₹', kind:'formula', expr:'seat_list * (1 - seat_discount_pct)'});
  upsertPricingVar({key:'revenue_usage_net', name:'Usage net (after line discount)', unit:'₹', kind:'formula', expr:'usage_list * (1 - usage_discount_pct)'});
  upsertPricingVar({key:'pricing_after_contract', name:'After contract discount', unit:'₹', kind:'formula', expr:'(revenue_seats_net + revenue_usage_net) * (1 - contract_discount_pct)'});
  upsertPricingVar({key:'pricing_after_promo', name:'After promo discount', unit:'₹', kind:'formula', expr:'pricing_after_contract * (1 - promo_discount_pct)'});
  upsertPricingVar({key:'revenue_total_net', name:'Net after waterfall', unit:'₹', kind:'formula', expr:'max(0, pricing_after_promo - discount_amount)'});
  upsertPricingVar({key:'arpu', name:'ARPU', unit:'₹', kind:'formula', expr:'if(paying_seats, revenue_total_net / paying_seats, 0)'});
  upsertPricingVar({key:'effective_discount_pct', name:'Effective discount', unit:'%', kind:'formula', expr:'if(list_revenue, 1 - revenue_total_net / list_revenue, 0)'});

  /* Never alias P&L Net revenue into Pricing’s revenue_total_net after a formula-graph Scan */
  if(pricing.link_revenue && !(model.sources && model.sources.graph)){
    const rev = vget('revenue');
    const sheetBacked = rev && (rev.srcGraph || rev.srcLine || (rev.sheetFormula && String(rev.sheetFormula).startsWith('=')));
    if(sheetBacked){ /* keep walk */ }
    else if(rev){ rev.kind='formula'; rev.expr='revenue_total_net'; rev.name = rev.name||'Net revenue'; rev.unit = rev.unit||'₹'; }
    else upsertPricingVar({key:'revenue', name:'Net revenue', unit:'₹', kind:'formula', expr:'revenue_total_net'});
  }
  if(!model.displayVars || !model.displayVars.length) model.displayVars = ['revenue_total_net'];
  else if(!model.displayVars.includes('revenue_total_net') && !model.displayVars.includes('revenue')) model.displayVars = ['revenue_total_net'].concat(model.displayVars);
  recompileAll();
  return c0;
}

/** Exact upstream keys from compiled model formula — never synonym guesses. */
function pickPnlDisplayKeys(vars){
  const list=vars||model.vars||[];
  const want=[/^net\s*revenue$/i, /contribution\s*margin(?!\s*%)/i, /^ebitda$/i];
  const out=[];
  want.forEach(re=>{
    const hit=list.find(v=>v&&v.kind==='formula'&&re.test(String(v.name||'').trim()));
    if(hit&&!out.includes(hit.key)) out.push(hit.key);
  });
  return out;
}
function driversOf(v){
  if(!v || v.kind!=='formula' || !v.expr) return [];
  try{ return [...new Set((compile(v.expr).deps||[]).map(String))]; }catch(e){ return []; }
}
/** Exact downstream: other formulas whose compiled deps include this key. */
function feedsIntoOf(key){
  const kl=String(key||'').toLowerCase(); if(!kl) return [];
  const out=[];
  (model.vars||[]).forEach(v=>{
    if(!v || v.kind!=='formula' || !v.expr) return;
    if(String(v.key).toLowerCase()===kl) return;
    try{
      const deps=(compile(v.expr).deps||[]).map(d=>String(d).toLowerCase());
      if(deps.includes(kl)) out.push(v.key);
    }catch(e){}
  });
  return out;
}
function driverCountLabel(n){
  if(!n) return 'No drivers';
  return n===1 ? '1 driver' : (n+' drivers');
}
/** Show model expr with business names (longest keys first). Keys stay the source of truth. */
function exprToHuman(expr){
  const raw=String(expr||'').trim(); if(!raw) return '';
  /* Display-only: * → ×. Never rewrite "/" — names like "price / account / month" must keep slashes. */
  let out=raw.replace(/\*/g,' × ');
  const keys=(model.vars||[]).map(v=>v.key).filter(Boolean).sort((a,b)=>b.length-a.length);
  keys.forEach(k=>{
    const v=vget(k); if(!v||!v.name) return;
    const re=new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
    out=out.replace(re, v.name);
  });
  return out.replace(/\s+/g,' ').trim();
}
/** Split plain-terms on top-level + (respect parentheses). */
function splitTopLevelSum(human){
  const s=String(human||''); const parts=[]; let buf='', depth=0;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch==='(') depth++;
    if(ch===')') depth=Math.max(0,depth-1);
    if(ch==='+' && depth===0){ const t=buf.trim(); if(t) parts.push(t); buf=''; continue; }
    buf+=ch;
  }
  const t=buf.trim(); if(t) parts.push(t);
  return parts;
}
/**
 * Plain-terms HTML. Tier cards only when top-level summands already name Starter/Pro/Enterprise.
 * Never invents model lines — tags are display labels only.
 */
function plainTermsHtml(v){
  if(!v||!v.expr) return '<p class="mut fz12">No model formula yet.</p>';
  const human=exprToHuman(v.expr); if(!human) return '<p class="mut fz12">No model formula yet.</p>';
  const parts=splitTopLevelSum(human);
  const tierOf=p=>{
    if(/\bstarter\b/i.test(p)) return 'Starter';
    if(/\bpro\b/i.test(p)) return 'Pro';
    if(/\benterprise\b/i.test(p)) return 'Enterprise';
    return '';
  };
  const tagged=parts.map(p=>({p, tier:tierOf(p)}));
  const tiersFound=[...new Set(tagged.map(t=>t.tier).filter(Boolean))];
  const allTagged=tagged.length>=2 && tagged.every(t=>t.tier) && tiersFound.length>=2;
  if(!allTagged){
    return '<div class="plain-box"><div class="human-expr">'+esc(human)+'</div></div>';
  }
  const order=['Starter','Pro','Enterprise'];
  const sorted=tagged.slice().sort((a,b)=>order.indexOf(a.tier)-order.indexOf(b.tier));
  let html='<div class="plain-box"><div class="plain-eq">'+esc(v.name||'This line')+' =</div>';
  sorted.forEach((t,i)=>{
    if(i) html+='<div class="plain-plus">+</div>';
    const cls=t.tier.toLowerCase();
    html+='<div class="plain-tier"><span class="tag '+cls+'">'+esc(t.tier)+'</span><span>'+esc(t.p)+'</span></div>';
  });
  html+='<div class="plain-total">Total = '+esc(tiersFound.sort((a,b)=>order.indexOf(a)-order.indexOf(b)).join(' + '))+' <span class="mut" style="font-weight:500">(display groups from the formula — not separate model lines)</span></div>';
  html+='</div>';
  return html;
}
/** Map a var key → A1 for period offset p within its mapped forecast range (same row, col+p). */
function cellRefForVarPeriod(v, p, preferSheet){
  if(!v||!v.range) return null;
  const rp=parseRange(v.range); if(!rp.col||!rp.row) return null;
  const c0=colToNum(rp.col); if(!c0) return null;
  const col=numToCol(c0+Math.max(0,p|0));
  const sh=String(rp.sheet||'').trim();
  const pref=String(preferSheet||'').trim();
  if(sh && pref && sh.toLowerCase()===pref.toLowerCase()) return col+rp.row;
  if(!sh) return col+rp.row;
  const q=/[^A-Za-z0-9_]/.test(sh)?("'"+sh+"'"):sh;
  return q+'!'+col+rp.row;
}
/**
 * Build one sheet formula string for period p from model expr.
 * Only substitutes mapped drivers — fails closed if a driver has no range.
 */
function modelExprToSheetFormulaAt(expr, p, targetSheet){
  const raw=String(expr||'').trim(); if(!raw) return {ok:false, reason:'empty formula'};
  let deps=[];
  try{ deps=(compile(raw).deps||[]).map(String); }catch(e){ return {ok:false, reason:String(e.message||e)}; }
  const keys=deps.slice().sort((a,b)=>b.length-a.length);
  let out='='+raw;
  const missing=[];
  keys.forEach(k=>{
    const v=vget(k);
    const ref=cellRefForVarPeriod(v, p, targetSheet);
    if(!ref){ missing.push(k); return; }
    const re=new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');
    out=out.replace(re, ref);
  });
  if(missing.length) return {ok:false, reason:'unmapped driver(s): '+missing.map(k=>{ const v=vget(k); return v?v.name:k; }).join(', ')};
  /* Reject if any model keys remain (would write nonsense into the sheet) */
  const still=[];
  (model.vars||[]).forEach(v=>{
    if(!v.key) return;
    const re=new RegExp('\\b'+v.key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    if(re.test(out.replace(/^=/,''))) still.push(v.key);
  });
  if(still.length) return {ok:false, reason:'could not map: '+still.join(', ')};
  return {ok:true, formula:out};
}
/** Formulas row for the full mapped span — real sheet formulas, never values. */
function buildFormulaWriteRow(v){
  if(!v||v.kind!=='formula'||!v.expr||!v.range) return {ok:false, reason:'need formula + mapped range'};
  const rp=parseRange(v.range);
  if(!rp.col||!rp.row) return {ok:false, reason:'mapped range is incomplete'};
  const n=Math.max(1, P());
  const row=[];
  for(let p=0;p<n;p++){
    const got=modelExprToSheetFormulaAt(v.expr, p, rp.sheet);
    if(!got.ok) return got;
    row.push(got.formula);
  }
  /* Rebuild A1 from start cell + period count so Apps Script can expand columns if needed */
  const range=buildRange(rp.sheet, rp.col, rp.row, n) || v.range;
  return {ok:true, range, formulas:[row], human:exprToHuman(v.expr)};
}
async function writeFormulaLogicToSheet(v){
  const built=buildFormulaWriteRow(v);
  if(!built.ok) throw new Error(built.reason||'cannot build sheet formulas');
  if(!conn.connected||!conn.url||!conn.token) throw new Error('Connect a sheet first');
  let res, text='';
  try{
    res=await fetch(conn.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:conn.token,action:'write',ssid:conn.ssid||'',writes:[{range:built.range, formulas:built.formulas}]})});
    text=await res.text();
  }catch(e){
    throw new Error('Could not reach Apps Script (network). Redeploy Code.gs as New version, then try again.');
  }
  let data=null;
  try{ data=JSON.parse(text); }catch(e){
    throw new Error('Apps Script returned a non-JSON response. Redeploy latest Code.gs (New version) with formula write support.');
  }
  if(!data||data.ok===false) throw new Error((data&&data.error)||'Sheet write failed');
  v.sheetFormula=built.formulas[0][0];
  return built;
}

function commitConfirmClassify(key){

    try{ compile(expr); }catch(e){ toast(String(e.message||e)); return; }

  }
  if(kind==='input'){ v.writable=true; if(v.base==null) v.base=0; }

  if(!fr) fr=buildRange((document.getElementById('ccFSheet')||{}).value||'', (document.getElementById('ccFCol')||{}).value||'', (document.getElementById('ccFRow')||{}).value||'', P());

function confirmAllSuggested(){

const CANW=4200, CANH=2800;
let _pan={x:0,y:0};
let _zoom=1;
function clampZoom(z){ return Math.max(0.35, Math.min(2.2, z)); }
function applyCanvasTransform(){
  const inn=document.querySelector('#lineageCanvas .canvas-inner');
  if(inn) inn.style.transform=`translate(${_pan.x}px,${_pan.y}px) scale(${_zoom})`;
  const lab=document.getElementById('zoomLabel');
  if(lab) lab.textContent=Math.round(_zoom*100)+'%';
}
function canvasZoomBy(factor, cx, cy){
  const cv=document.getElementById('lineageCanvas'); if(!cv) return;
  const r=cv.getBoundingClientRect();
  const mx = (cx!=null?cx: r.left+r.width/2) - r.left;
  const my = (cy!=null?cy: r.top+r.height/2) - r.top;
  const prev=_zoom;
  const next=clampZoom(prev*factor);
  if(Math.abs(next-prev)<1e-6) return;
  _pan.x = mx - (mx - _pan.x) * (next/prev);
  _pan.y = my - (my - _pan.y) * (next/prev);
  _zoom=next;
  applyCanvasTransform();
}
function canvasZoomIn(){ canvasZoomBy(1.15); }
function canvasZoomOut(){ canvasZoomBy(1/1.15); }
function canvasZoomReset(){ _zoom=1; _pan={x:0,y:0}; applyCanvasTransform(); }

/* ---- drag-and-drop lineage canvas ---- */
function nodeDepth(){
  const depth={};
  function d(v,seen){ if(depth[v.key]!=null) return depth[v.key]; if(v.kind!=='formula') return depth[v.key]=0; if(seen.has(v.key)) return 0; seen.add(v.key);
    const deps=(v.compiled?compile(v.expr).deps:compile(v.expr).deps); let mx=0;
    deps.forEach(k=>{ const dv=model.vars.find(x=>x.key.toLowerCase()===k.toLowerCase()); if(dv) mx=Math.max(mx,d(dv,seen)+1); }); return depth[v.key]=mx; }
  model.vars.forEach(v=>d(v,new Set())); return depth;
}
function autoLayout(){
  const cv=document.getElementById('lineageCanvas'); const W=cv?Math.max(cv.clientWidth,900):900;
  const depth=nodeDepth(); const maxD=Math.max(0,...Object.values(depth));
  /* Prefer readable gaps over packing into the viewport — zoom handles overview */
  const colX = maxD>0 ? Math.max(220, Math.min(280, Math.floor((Math.max(W,1100)-80)/Math.max(1,maxD)))) : 240;
  const rowH = 108;
  model.nodePos=model.nodePos||{};
  // lay each page out independently, preserving each node's page
  const perColByPage={};
  model.vars.forEach(v=>{ const pg=nodePage(v.key); const c=depth[v.key]||0;
    const pc=perColByPage[pg]=perColByPage[pg]||{}; pc[c]=pc[c]||0;
    model.nodePos[v.key]={x:28+c*colX, y:28+pc[c]*rowH, pg}; pc[c]++; });
}
