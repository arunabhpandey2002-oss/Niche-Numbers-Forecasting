/* ---- account drill-down: every metric for one account as a FORECAST vs ACTUAL view.
   The distance between the two lines is the variance — exactly the "understand more"
   picture. Independent of the table's dropdowns; shows an empty state if no actuals. ---- */
function openAccount(acct){
  const lines=model.vars.filter(v=>nrm(v.account||v.name)===nrm(acct));
  if(!lines.length){ toast('No lines for this account'); return; }
  const F=versionData('forecast'), A=versionData('actual'), la=lastActualIdx();
  const win=[0, la>=0?la:P()-1];
  const cutLabel = la>=0 ? model.periods[la] : null;
  const acctHasActual = lines.some(v=> v.actuals && v.actuals.some(x=>x!=null&&x!==''));
  const winLab = win[0]===win[1]?model.periods[win[0]]:model.periods[win[0]].split(' ')[0]+'–'+model.periods[win[1]].split(' ')[0];
  const hasA=v=>{ if(!v.actuals) return false; for(let p=win[0];p<=win[1];p++) if(v.actuals[p]!=null&&v.actuals[p]!=='') return true; return false; };
  // stable order: revenue-ish metrics first, then margins, then the rest
  const rank=m=>{ const s=nrm(m); if(/revenue|sales|gmv|bookings/.test(s))return 0; if(/margin|gross|contribution/.test(s))return 1; if(/ebitda|profit|net/.test(s))return 2; return 3; };
  lines.sort((a,b)=>rank(a.metric)-rank(b.metric));
  const cards=lines.map(v=>{
    const fT=vAgg(F,v.key,win);
    const aT=hasA(v)?vAgg(A,v.key,win):null;
    const d=(aT!=null)?aT-fT:null, fav=d!=null?isFav(v,d):null, pct=(d!=null&&fT)?d/Math.abs(fT)*100:null;
    const agg=AGG_LABEL[aggMethod(v)].toLowerCase();
    return `<div class="acctcard">
      <div class="acctcard-head">
        <div><span class="metname">${esc(v.metric||v.name)}</span> <span class="mut fz11">· ${agg} over ${winLab}</span></div>
        <span class="fu ${fav==null?'na':fav?'fav':'unf'}">${fav==null?'no actual':fav?'Favourable':'Unfavourable'}</span>
      </div>
      <div class="acctkpis">
        <div class="akpi"><label>Forecast</label><b>${fmtVar(fT,v.unit)}</b></div>
        <div class="akpi"><label>Actual</label><b>${aT==null?'<span class=&quot;mut&quot;>—</span>':fmtVar(aT,v.unit)}</b></div>
        <div class="akpi"><label>Variance</label><b class="${d>0?'pos':d<0?'negv':''}">${d==null?'<span class=&quot;mut&quot;>—</span>':d===0?'—':fmtDelta(d,v.unit)}${pct!=null&&d!==0?` <span class="mut fz11">${pct>=0?'+':''}${pct.toFixed(1)}%</span>`:''}</b></div>
      </div>
      ${acctChart(v,F,A,la)}
    </div>`;
  }).join('');
  const banner = acctHasActual ? '' : `<div class="acctempty">No actuals loaded for this account yet — showing the forecast trend only. Import your <b>actuals</b> file (Sources) or map an actuals cell in Model setup, and the gap between the forecast and actual lines becomes the variance.</div>`;
  showModal(`<div class="acctview">
    <div class="mhead"><div><h3>${esc(acct)}</h3><p class="mut fz11" style="margin:2px 0 0">Account view · forecast vs actual${cutLabel?` · actuals through ${cutLabel}`:''}</p></div><button class="x" onclick="closeModal()">×</button></div>
    <div class="mbody">
      <div class="acctlegend"><span><i class="ln fc"></i>Forecast</span><span><i class="ln ac"></i>Actual</span><span><i class="sw"></i>Variance</span>${cutLabel?'<span><i class="cut"></i>History cutoff</span>':''}</div>
      ${banner}${cards}
    </div></div>`);
}
/* SVG chart for one line: forecast F (indigo) vs actual A (green); variance = the shaded gap.
   Both series over the FULL timeline so the trend is visible; KPIs above use the overlap window. */
function acctChart(v,F,A,la){
  const n=P(), per=model.periods;
  const bArr=(F[v.key]||[]).map(x=>x==null||x===''?null:Number(x));   // forecast
  const aArr=(A[v.key]||[]).map(x=>x==null||x===''?null:Number(x));   // actual
  const vals=[]; bArr.forEach(x=>{ if(x!=null&&!isNaN(x)) vals.push(x); }); aArr.forEach(x=>{ if(x!=null&&!isNaN(x)) vals.push(x); });
  if(!vals.length) return '<p class="mut fz12" style="margin:2px 0 0">No data to chart.</p>';
  let hi=Math.max(...vals), lo=Math.min(0,...vals); let rng=(hi-lo)||Math.abs(hi)||1; hi+=rng*0.10; lo-=rng*0.06; const R=(hi-lo)||1;
  const W=680,H=200, padL=6,padR=10,padT=12,padB=24, iw=W-padL-padR, ih=H-padT-padB;
  const X=i=> padL + (n<=1?iw/2 : i/(n-1)*iw);
  const Y=val=> padT + (hi-val)/R*ih;
  const pathOf=arr=>{ let d='',pen=false; arr.forEach((val,i)=>{ if(val==null||isNaN(val)){pen=false;return;} d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(val).toFixed(1)+' '; pen=true; }); return d.trim(); };
  // variance area over contiguous runs where BOTH series exist
  let areas='', run=[];
  const flush=()=>{ if(run.length>1){ const top=run.map(i=>X(i).toFixed(1)+' '+Y(bArr[i]).toFixed(1)).join(' L');
      const bot=run.slice().reverse().map(i=>X(i).toFixed(1)+' '+Y(aArr[i]).toFixed(1)).join(' L');
      areas+=`<path d="M${top} L${bot} Z" fill="var(--red)" opacity="0.10"/>`; } run=[]; };
  for(let i=0;i<n;i++){ if(bArr[i]!=null&&!isNaN(bArr[i])&&aArr[i]!=null&&!isNaN(aArr[i])) run.push(i); else flush(); } flush();
  // dots on the comparison line
  let dots=''; aArr.forEach((val,i)=>{ if(val!=null&&!isNaN(val)) dots+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(val).toFixed(1)}" r="2.4" fill="var(--green)"/>`; });
  // zero baseline if range straddles zero
  const zeroLine = (lo<0&&hi>0)?`<line x1="${padL}" y1="${Y(0).toFixed(1)}" x2="${W-padR}" y2="${Y(0).toFixed(1)}" stroke="#e7eaf0" stroke-width="1"/>`:'';
  // history cutoff (only when actuals are one of the two versions)
  let cut='';
  if(la>=0&&la<n){ const cx=X(la).toFixed(1); cut=`<line x1="${cx}" y1="${padT-4}" x2="${cx}" y2="${padT+ih}" stroke="#b8c0d6" stroke-width="1" stroke-dasharray="3 3"/>`; }
  // month axis (thin it out)
  const step=Math.max(1,Math.ceil(n/8)); let axis='';
  for(let i=0;i<n;i+=step){ axis+=`<text x="${X(i).toFixed(1)}" y="${H-7}" font-size="9" fill="#8b93a8" text-anchor="${i===0?'start':i>=n-step?'end':'middle'}">${(per[i]||'').split(' ')[0]}</text>`; }
  const yTop=`<text x="${padL}" y="${(padT+4).toFixed(1)}" font-size="9" fill="#aab0be">${fmtVar(hi,v.unit)}</text>`;
  const yBot=`<text x="${padL}" y="${(padT+ih-1).toFixed(1)}" font-size="9" fill="#aab0be">${fmtVar(lo,v.unit)}</text>`;
  return `<svg class="acctsvg" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">
    ${zeroLine}${areas}${cut}
    <path d="${pathOf(bArr)}" fill="none" stroke="var(--indigo)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${pathOf(aArr)}" fill="none" stroke="var(--green)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${axis}${yTop}${yBot}</svg>`;
}
let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1900); }

/* ---- boot ---- */
loadLocal();
render();
</script>
