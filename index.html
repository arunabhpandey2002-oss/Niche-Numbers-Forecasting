/* strip a variable from a formula expression (tokenizer-based), collapsing the
   adjacent binary operator. Returns the new expression, or null if unsafe. */
function stripVarFromExpr(expr,varKey){
  const toks=(String(expr).match(/[A-Za-z_][A-Za-z0-9_]*|\d+\.?\d*|[()+\-*/]/g))||[];
  const isOp=t=>['+','-','*','/'].includes(t);
  const out=[];
  for(let i=0;i<toks.length;i++){ const t=toks[i];
    if(/^[A-Za-z_]/.test(t)&&t.toLowerCase()===varKey.toLowerCase()){
      if(out.length&&isOp(out[out.length-1])) out.pop();               // drop preceding operator
      else if(i+1<toks.length&&isOp(toks[i+1])) i++;                    // else drop following operator
      continue;
    }
    out.push(t);
  }
  let s=out.join(' ').replace(/\(\s*\)/g,'').replace(/\(\s+/g,'(').replace(/\s+\)/g,')').trim();
  if(!s||isOp(s[0])||isOp(s[s.length-1])) return null;                  // dangling operator → unsafe
  let bal=0; for(const c of s){ if(c==='(')bal++; if(c===')')bal--; if(bal<0) return null; } if(bal!==0) return null;
  return s;
}

function attachCanvas(cv){
  if(cv._bound) return; cv._bound=true;
  let mode=null,cur=null,off=null,from=null,tmp=null,panS=null,moved=false,sx0=0,sy0=0;
  const inner=()=>cv.querySelector('.canvas-inner');
  const esc2=k=>(window.CSS&&CSS.escape)?CSS.escape(k):k;
  const toLocal=(e,r)=>({x:(e.clientX-r.left-_pan.x)/_zoom, y:(e.clientY-r.top-_pan.y)/_zoom});
  cv.addEventListener('pointerdown',e=>{
    moved=false; sx0=e.clientX; sy0=e.clientY;
    const handle=e.target.closest('[data-handle]'), node=e.target.closest('.node2');
    if(handle&&node){ mode='link'; from=node.dataset.key; try{cv.setPointerCapture(e.pointerId);}catch(_){}
      tmp=document.createElementNS('http://www.w3.org/2000/svg','path'); tmp.setAttribute('stroke','#4055c7'); tmp.setAttribute('stroke-width','2'); tmp.setAttribute('fill','none'); tmp.setAttribute('stroke-dasharray','4 3'); document.getElementById('lineLinks').appendChild(tmp); e.preventDefault(); return; }
    if(node){ mode='drag'; cur=node; const r=cv.getBoundingClientRect(); const p=model.nodePos[node.dataset.key]; const loc=toLocal(e,r); off={dx:loc.x-p.x, dy:loc.y-p.y}; try{cv.setPointerCapture(e.pointerId);}catch(_){}; node.style.cursor='grabbing'; e.preventDefault(); return; }
    mode='pan'; panS={x:e.clientX,y:e.clientY,px:_pan.x,py:_pan.y}; try{cv.setPointerCapture(e.pointerId);}catch(_){}; cv.style.cursor='grabbing'; e.preventDefault();
  });
  cv.addEventListener('pointermove',e=>{
    if(Math.abs(e.clientX-sx0)>4 || Math.abs(e.clientY-sy0)>4) moved=true;
    const r=cv.getBoundingClientRect();
    if(mode==='drag'&&cur){ const loc=toLocal(e,r); let x=loc.x-off.dx, y=loc.y-off.dy; x=Math.max(0,Math.min(CANW-60,x)); y=Math.max(0,Math.min(CANH-40,y)); model.nodePos[cur.dataset.key]={x,y,pg:nodePage(cur.dataset.key)}; cur.style.left=x+'px'; cur.style.top=y+'px'; redrawLinks(); }
    else if(mode==='link'&&tmp){ const fe=cv.querySelector(`.node2[data-key="${esc2(from)}"]`); if(!fe)return; const p=model.nodePos[from]; const loc=toLocal(e,r); const sx=p.x+fe.offsetWidth, sy=p.y+fe.offsetHeight/2; tmp.setAttribute('d',`M${sx},${sy} L${loc.x},${loc.y}`); }
    else if(mode==='pan'&&panS){ _pan.x=panS.px+(e.clientX-panS.x); _pan.y=panS.py+(e.clientY-panS.y); applyCanvasTransform(); }
  });
  cv.addEventListener('pointerup',e=>{
    if(mode==='link'){ if(tmp){tmp.remove();tmp=null;} const el=document.elementFromPoint(e.clientX,e.clientY); const tn=el&&el.closest('.node2'); if(tn&&tn.dataset.key!==from) appendDep(from,tn.dataset.key); }
    if(mode==='drag'&&cur){
      cur.style.cursor='grab';
      if(moved) saveModel();
      else selectSetupLine(cur.dataset.key, {edit:true}); /* click → same Edit box as table row */
    }
    if(mode==='pan'){
      cv.style.cursor='';
      if(!moved) clearSetupSelection(); /* empty canvas click clears focus */
    }
    mode=null;cur=null;from=null;panS=null;
  });
  cv.addEventListener('pointercancel',()=>{ if(tmp){tmp.remove();tmp=null;} mode=null;cur=null;from=null;panS=null; cv.style.cursor=''; });
  cv.addEventListener('dblclick',e=>{ const node=e.target.closest('.node2'); if(node){ selectSetupLine(node.dataset.key, {edit:true}); e.preventDefault(); } });
  cv.addEventListener('wheel',e=>{
    e.preventDefault();
    const factor = e.deltaY<0 ? 1.1 : 1/1.1;
    canvasZoomBy(factor, e.clientX, e.clientY);
  }, {passive:false});
}

function addChartLine(k){
  if(!vget(k)) return;

/* upstream leaf inputs of a variable (recurse formulas down to inputs) */
function leavesOf(key){
  const acc=new Set();
  (function walk(k,seen){ const v=vget(k)||model.vars.find(x=>x.key.toLowerCase()===String(k).toLowerCase()); if(!v) return;
    if(v.kind==='input'){ acc.add(v.key); return; } if(v.kind==='output'){ return; }
    if(seen.has(v.key)) return; seen.add(v.key); compile(v.expr||'').deps.forEach(d=>walk(d,seen)); })(key,new Set());
  return acc;
}

function renderAssumptions(){
  const el=document.getElementById('asmList'); if(!el) return;
  renderAsmCrumb();
  const parentKey=forecastDriverParent();
  const parent=parentKey?vget(parentKey):null;
  if(!parent){
    el.innerHTML=`<div class="asm-empty">Add a P&amp;L line to the chart to see its drivers.</div>`;
    return;
  }
  if(parent.kind==='input'){
    el.innerHTML=asmInputCard(parent)+`<div class="asm-empty" style="margin-top:8px">This is an input — set it here. No deeper drivers.</div>`;
    return;
  }
  const deps=driversOf(parent);
  if(!deps.length){
    el.innerHTML=`<div class="asm-empty">No first-level drivers on ${esc(parent.name)} yet.</div>`;
    return;
  }
  const base=evalModel(true);
  el.innerHTML=deps.map(dk=>{
    const v=vget(dk);
    if(!v) return `<div class="asm"><div class="asm-head"><strong>${esc(dk)}</strong></div><div class="asm-empty">Missing from model</div></div>`;
    if(v.kind==='input') return asmInputCard(v);
    const val=base[v.key]?fmtVar(base[v.key][0]||0,v.unit):'';
    const n=driversOf(v).length;
    return `<div class="asm formula-drv" onclick="forecastDrillInto('${v.key}')" title="See drivers of ${esc(v.name)}">
      <div class="asm-head"><div><strong>${esc(v.name)}</strong> <span class="k">${esc(v.key)}</span></div>
        ${hasOv(v.key)?`<span class="change-pill">edited</span>`:''}</div>
      <div class="mut fz12">${val?`Now ${val} · `:''}${esc(driverCountLabel(n))}</div>
      <div class="drillhint">Drill into drivers →</div>
    </div>`;
  }).join('');
}
function asmInputCard(v){
  const steps=(v.steps||[]).slice().sort((a,b)=>a.from-b.from).map((s,si)=>`<span class="stepchip">from ${model.periods[s.from]}: ${fmtVar(s.value,v.unit)} <span class="x" onclick="delStep('${v.key}',${si})">✕</span></span>`).join('');
  const ov=(model.ov&&model.ov[v.key])||{};
  const ovChips=Object.keys(ov).map(p=>+p).sort((a,b)=>a-b).map(p=>`<span class="ovchip">from ${model.periods[p].split(' ')[0]}: ${fmtVar(ov[p],v.unit)} <span class="x" onclick="delOvClick('${v.key}',${p})">✕</span></span>`).join('');
  const rampOn=v.ramp&&v.ramp.on, seasonOn=v.phase&&v.phase.some(x=>Math.abs((x==null?1:x)-1)>1e-6);
  const shapeChip = rampOn?`<span class="shapechip" onclick="openShape('${v.key}')">↗ Ramp ${fmtVar(v.ramp.from!=null?v.ramp.from:0,v.unit)}→${fmtVar(v.ramp.to!=null?v.ramp.to:v.base,v.unit)} · ${v.ramp.months}mo</span>`
    : seasonOn?`<span class="shapechip" onclick="openShape('${v.key}')">∿ Seasonal shape</span>`
    : `<span class="stepadd" onclick="openShape('${v.key}')">＋ shape (ramp / seasonal)</span>`;
  return `<div class="asm">
    <div class="asm-head"><div><strong>${esc(v.name)}</strong> <span class="k">${esc(v.key)}</span></div>
      ${hasOv(v.key)?`<span class="change-pill">edited</span>`:''}</div>
    <div class="asm-base"><span class="lab">${rampOn?'Target':'Base'}</span><input class="inp num" type="number" step="any" value="${v.base}" onchange="setBase('${v.key}',this.value)"><span class="lab">${esc(v.unit||'')}</span></div>
    <div class="steps">${rampOn?'':steps+`<span class="stepadd" onclick="addStep('${v.key}')">＋ step change</span>`}${shapeChip}</div>
    ${ovChips?`<div class="steps" style="margin-top:2px">${ovChips}</div>`:''}
  </div>`;
}
function setBase(k,val){ vget(k).base=parseFloat(val)||0; renderForecast(); saveModel(); }
function delOvClick(k,p){ delOv(k,p); renderAssumptions(); renderForecast(); saveModel(); }
function addStep(k){
  const v=vget(k);
  showModal(`<div class="mhead"><h3>Step change · ${v.name}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="mbody"><div class="frow two">

}
function commitStep(k){ const v=vget(k); const from=+document.getElementById('stFrom').value, val=parseFloat(document.getElementById('stVal').value)||0;
  v.steps=(v.steps||[]).filter(s=>s.from!==from); v.steps.push({from,value:val}); closeModal(); renderAssumptions(); renderForecast(); saveModel(); }
function delStep(k,si){ const v=vget(k); const sorted=(v.steps||[]).slice().sort((a,b)=>a.from-b.from); const s=sorted[si]; v.steps=v.steps.filter(x=>x!==s); renderAssumptions(); renderForecast(); saveModel(); }

/* ---- Shape editor: give an input a ramp or a seasonal curve over time ---- */
const SEAS_MAX=2;   // seasonal multiplier range 0..2 (1 = flat)
function shapeModeOf(v){ if(v.ramp&&v.ramp.on) return 'ramp'; if(v.phase&&v.phase.some(x=>Math.abs((x==null?1:x)-1)>1e-6)) return 'seasonal'; return 'flat'; }
function openShape(k){ window.__shapeKey=k; window.__shapeMode=shapeModeOf(vget(k)); drawShapeModal(); }
function drawShapeModal(){
  const v=vget(window.__shapeKey), mode=window.__shapeMode||shapeModeOf(v), n=P();
  const seg=`<div class="seg"><button class="${mode==='flat'?'on':''}" onclick="setShapeMode('flat')">Flat</button><button class="${mode==='ramp'?'on':''}" onclick="setShapeMode('ramp')">Ramp</button><button class="${mode==='seasonal'?'on':''}" onclick="setShapeMode('seasonal')">Seasonal</button></div>`;
  let bodyInner='';
  if(mode==='flat'){
    bodyInner=`<p class="mut fz12" style="margin:6px 0 0">This assumption holds its base value (with any step changes you add) — flat over time. Switch to <b>Ramp</b> to grow it from a start to a target over N months, or <b>Seasonal</b> to give it a repeating monthly shape.</p>`;
  } else if(mode==='ramp'){
    const r=v.ramp||{}; const from=r.from!=null?r.from:0, to=r.to!=null?r.to:v.base, start=r.start|0, months=r.months||6;
    bodyInner=`<div class="frow two" style="margin-top:12px">
        <div class="field"><label>Start from (${v.unit})</label><input class="inp" id="rFrom" type="number" step="any" value="${from}" oninput="commitRamp()"></div>
        <div class="field"><label>Reach (${v.unit})</label><input class="inp" id="rTo" type="number" step="any" value="${to}" oninput="commitRamp()"></div></div>
      <div class="frow two">
        <div class="field"><label>Starting month</label><select id="rStart" onchange="commitRamp()">${model.periods.map((m,i)=>`<option value="${i}" ${i===start?'selected':''}>${m}</option>`).join('')}</select></div>
        <div class="field"><label>Over how many months</label><input class="inp" id="rMonths" type="number" min="1" max="${n}" value="${months}" oninput="commitRamp()"></div></div>
      <p class="mut fz11" style="margin:10px 0 0">Ramps linearly, then holds at the target. The <b>Reach</b> value is this assumption's base.</p>`;
  } else {
    bodyInner=`<p class="mut fz12" style="margin:8px 0 10px">Drag the bars to shape each month as a multiple of the base (middle line = 1.0×). The base value stays your reference level.</p>
      <div class="sbars" id="sbars"><div class="midline"></div>${model.periods.map((m,i)=>{const ph=(v.phase&&v.phase[i]!=null)?v.phase[i]:1; const h=Math.max(2,Math.min(100,ph/SEAS_MAX*100)); return `<div class="sbar" data-i="${i}"><i style="height:${h}%"></i><span>${m.split(' ')[0]}</span></div>`;}).join('')}</div>
      <div style="display:flex;justify-content:space-between;margin-top:26px"><button class="btn sm" onclick="seasonPreset('flat')">Reset to flat</button><span class="mut fz11">tip: drag up = above base, down = below</span></div>`;
  }
  showModal(`<div class="mhead"><h3>Shape over time · ${v.name}</h3><button class="x" onclick="closeShape()">×</button></div>
    <div class="mbody">${seg}<div style="margin-top:6px">${bodyInner}</div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn primary" onclick="closeShape()">Done</button></div>
    </div>`);
  if(mode==='seasonal') bindSeasonBars();
}
function setShapeMode(m){
  const v=vget(window.__shapeKey); window.__shapeMode=m;
  if(m==='flat'){ if(v.ramp) v.ramp.on=false; v.phase=null; }
  if(m==='ramp'){ v.phase=null; if(!v.ramp) v.ramp={}; v.ramp.on=true; if(v.ramp.from==null)v.ramp.from=0; if(v.ramp.to==null)v.ramp.to=v.base; if(v.ramp.start==null)v.ramp.start=0; if(!v.ramp.months)v.ramp.months=Math.min(6,P()); }
  if(m==='seasonal'){ if(v.ramp) v.ramp.on=false; if(!v.phase||!v.phase.length) v.phase=new Array(P()).fill(1); }
  drawShapeModal(); renderAssumptions(); renderForecast(); saveModel();
}
function commitRamp(){ const v=vget(window.__shapeKey); if(!v.ramp)v.ramp={on:true};
  v.ramp.from=parseFloat(document.getElementById('rFrom').value)||0;
  v.ramp.to=parseFloat(document.getElementById('rTo').value)||0; v.base=v.ramp.to;
  v.ramp.start=+document.getElementById('rStart').value|0;
  v.ramp.months=Math.max(1,parseInt(document.getElementById('rMonths').value)||1);
  renderAssumptions(); renderForecast(); saveModel(); }
function seasonPreset(kind){ const v=vget(window.__shapeKey); if(kind==='flat') v.phase=new Array(P()).fill(1); drawShapeModal(); renderAssumptions(); renderForecast(); saveModel(); }
function bindSeasonBars(){
  const box=document.getElementById('sbars'); if(!box) return;
  const v=vget(window.__shapeKey); let active=null;
  const setFrom=(bar,clientY)=>{ const r=box.getBoundingClientRect(); let t=1-(clientY-r.top-10)/(r.height-20); t=Math.max(0,Math.min(1,t)); const val=+(t*SEAS_MAX).toFixed(2); const i=+bar.dataset.i; if(!v.phase)v.phase=new Array(P()).fill(1); v.phase[i]=val; bar.querySelector('i').style.height=Math.max(2,t*100)+'%'; renderForecast(); };
  box.querySelectorAll('.sbar').forEach(bar=>{ bar.addEventListener('pointerdown',e=>{ active=bar; bar.setPointerCapture(e.pointerId); setFrom(bar,e.clientY); e.preventDefault(); }); });
  box.addEventListener('pointermove',e=>{ if(active) setFrom(active,e.clientY); });
  const end=()=>{ if(active){ active=null; renderAssumptions(); saveModel(); } };
  box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end);
}
function closeShape(){ closeModal(); renderAssumptions(); renderForecast(); saveModel(); }

const CH={x0:34,x1:730,y0:26,y1:224,h:265};
const COLORS=['#4055c7','#0b8f9e','#a65d2b','#12805a','#c23140','#7b46c9','#d98324'];
let _dragging=false, _domains={};

/* per-series y-domain, padded; flat lines get a ±band so they're still draggable */
function seriesDomain(baseArr,scenArr){
  const all=(baseArr||[]).concat(scenArr||[]).filter(x=>isFinite(x));
  let lo=all.length?Math.min(...all):0, hi=all.length?Math.max(...all):1;
  if(hi-lo<1e-9){ const c=Math.abs(hi)||1; lo=hi-c*0.6; hi=hi+c*0.6; }
  else { const pad=(hi-lo)*0.18; lo-=pad; hi+=pad; }
  return {lo,hi};
}
const chX=(i,n)=>CH.x0+(CH.x1-CH.x0)*(i/Math.max(1,n-1));
const chY=(val,d)=>CH.y1-(CH.y1-CH.y0)*((val-d.lo)/((d.hi-d.lo)||1));

function renderForecast(){
  const base=evalModel(false), scen=evalModel(true);
  const keys=visibleKeys(), L=P()-1;
  const rt=document.getElementById('resTitle');
  if(rt) rt.textContent=`${keys.length>1?keys.length+' lines':vget(keys[0]).name} · ${model.periods[0]} to ${model.periods[L]}`;
  drawChart(base,scen);
  const leg=document.getElementById('serieslegend');
  if(leg) leg.innerHTML=keys.map((k,si)=>{ const v=vget(k),col=COLORS[si%COLORS.length];
    const bL=(base[k]||[])[L]||0, sL=(scen[k]||[])[L]||0, imp=sL-bL, pct=bL!==0?imp/Math.abs(bL)*100:0;
    const cls=imp>0?'pos':imp<0?'negv':'';
    return `<div class="slrow"><i style="background:${col}"></i><span class="nm">${v.name}</span><span class="vv">${fmtVar(bL,v.unit)} → ${fmtVar(sL,v.unit)}</span><span class="dd ${cls}">${imp===0?'—':fmtDelta(imp,v.unit)+' ('+(pct>=0?'+':'')+pct.toFixed(1)+'%)'}</span></div>`;
  }).join('')+`<div class="mut fz11" style="margin-top:6px">${model.periods[L].split(' ')[0]} baseline → scenario. Each line is drawn on its own scale so trends stay visible.</div>`;
  const sm=document.getElementById('solveMsg'); if(sm){ sm.hidden=!_solveMsg; sm.textContent=_solveMsg||''; }
  renderSolveBar();
}

function drawChart(base,scen){
  const svg=document.getElementById('chart'); if(!svg) return;
  const keys=visibleKeys(), n=P();
  if(!_dragging){ _domains={}; keys.forEach(k=>_domains[k]=seriesDomain(base[k],scen[k])); }
  let g=''; for(let r=0;r<4;r++){const y=CH.y0+(CH.y1-CH.y0)*r/3;g+=`<line class="grid-line" x1="${CH.x0}" y1="${y}" x2="${CH.x1}" y2="${y}"/>`;}
  let body='';
  keys.forEach((k,si)=>{ const v=vget(k), col=COLORS[si%COLORS.length], d=_domains[k]||{lo:0,hi:1};
    const b=base[k]||[], s=scen[k]||[];
    const bp=b.map((val,i)=>`${chX(i,n)},${chY(val,d)}`).join(' ');
    const sp=s.map((val,i)=>`${chX(i,n)},${chY(val,d)}`).join(' ');
    body+=`<polyline points="${bp}" fill="none" stroke="${col}" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.4" stroke-linejoin="round"/>`;
    body+=`<polyline id="scen_${k}" points="${sp}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round"/>`;
    const drag=v.kind!=='output';
    const closed=model.closed|0;
    body+=s.map((val,i)=>{
      const locked=i<closed;
      const can=drag&&!locked;
      return `<circle class="scenario-dot" data-key="${k}" data-i="${i}" data-locked="${locked?1:0}" cx="${chX(i,n)}" cy="${chY(val,d)}" r="4.2" style="fill:#fff;stroke:${col};${can?'cursor:ns-resize':(locked?'cursor:not-allowed;opacity:.32':'cursor:default;opacity:.45')}"></circle>`;
    }).join('');
  });
  const every=n>13?2:1;
  const labels=model.periods.map((m,i)=>(i%every===0)?`<text class="axis-label" x="${chX(i,n)}" y="258" text-anchor="middle">${m.split(' ')[0]}</text>`:'').join('');
  svg.innerHTML=`${g}${body}${labels}`;
  bindDrag(svg);
}

/* redraw the moving lines/dots ONLY (no innerHTML rebuild) so the held dot keeps pointer capture */
function updateDuringDrag(){
  const svg=document.getElementById('chart'); if(!svg) return;
  const scen=evalModel(true), keys=visibleKeys(), n=P();
  keys.forEach(k=>{ const d=_domains[k]||{lo:0,hi:1}, s=scen[k]||[];
    const pl=svg.querySelector('[id="scen_'+k+'"]'); if(pl) pl.setAttribute('points', s.map((val,i)=>`${chX(i,n)},${chY(val,d)}`).join(' '));
    svg.querySelectorAll('.scenario-dot[data-key="'+k+'"]').forEach(dot=>{ const i=+dot.dataset.i; dot.setAttribute('cy', chY(s[i],d)); });
  });
}

function bindDrag(svg){ let active=null, moved=false, startY=0;
  const toVal=(cy,d)=>{ const r=svg.getBoundingClientRect(); const yPx=(cy-r.top)/r.height*CH.h; let t=(CH.y1-yPx)/(CH.y1-CH.y0); t=Math.max(0,Math.min(1,t)); return d.lo+(d.hi-d.lo)*t; };
  svg.querySelectorAll('.scenario-dot').forEach(dot=>{
    const v=vget(dot.dataset.key); if(!v) return;
    const locked=dot.dataset.locked==='1' || (+dot.dataset.i < (model.closed|0));
    const canDrag=v.kind!=='output' && !locked;
    dot.style.cursor=canDrag?'ns-resize':(locked?'not-allowed':'pointer');
    dot.addEventListener('pointerdown',e=>{
      if(locked){ toast('Closed months are locked'); e.preventDefault(); return; }
      active={key:dot.dataset.key,i:+dot.dataset.i,canDrag}; moved=false; startY=e.clientY;
      if(canDrag){ _dragging=true; dot.setPointerCapture(e.pointerId); }
      e.preventDefault();
    });
  });
  svg.addEventListener('pointermove',e=>{
    if(!active) return;
    if(Math.abs(e.clientY-startY)>3) moved=true;
    if(!active.canDrag||!moved) return;
    const d=_domains[active.key]||{lo:0,hi:1}; applyDrag(active.key,active.i,toVal(e.clientY,d)); updateDuringDrag();
  });
  const end=()=>{
    if(!active) return;
    const was=active; active=null; _dragging=false;
    if(!moved){ openXray({key:was.key,period:was.i,whichA:'scenario',whichB:'plan'}); return; }
    if(was.canDrag){
      renderForecast(); renderAssumptions(); saveModel();
      if(_lastDragXray && _lastDragXray.key===was.key){
        const xr=_lastDragXray; _lastDragXray=null;
        openXray({key:xr.key,period:xr.period,whichA:'scenario',whichB:'plan'});
      }
    }
  };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
}

/* ============================ ALLOCATION ENGINE ============================
   Drag a line to a target at one period → decide how the change flows down the
   driver tree to LEAF inputs, write only those, carry forward. Three modes, all
   robust with numeric root-finding (no LP solver):
     proportional  – every free leaf moves by a common factor (bisection). Default.
     single        – one chosen leaf absorbs it, others held (bisection).
     balanced      – damped Newton on a numeric Jacobian: each leaf moves in
                     proportion to its marginal effect ∂output/∂leaf (least-change).
   Pinned leaves are removed from the free set. If the free set can't reach the
   target, we solve as close as possible and flag it (feasibility guard). */
let _solveMsg='';
let _lastDragXray=null; /* {key,period} open X-ray after successful formula drag */
function lineSolvePolicy(key){
  const v=vget(key)||{};
  const mode=(v.solveMode!=null&&v.solveMode!=='')?v.solveMode:(model.solveMode||'proportional');
  const solveDriver=(v.solveDriver!=null&&v.solveDriver!=='')?v.solveDriver:model.solveDriver;
  const pins=Array.isArray(v.pins)?v.pins:(model.pins||[]);
  return {mode, solveDriver, pins, scoped: !!(v.solveMode||v.solveDriver||(v.pins&&v.pins.length))};
}
function isPinned(k, forKey){
  const pins=forKey!=null?lineSolvePolicy(forKey).pins:(model.pins||[]);
  return (pins||[]).includes(k);
}
function freeLeavesOf(key){
  const pol=lineSolvePolicy(key);
  const pins=new Set(pol.pins||[]);
  let ls=[...leavesOf(key)].map(k=>vget(k)).filter(v=>v&&v.kind==='input'&&!pins.has(v.key));
  if(pol.mode==='single' && pol.solveDriver){
    const d=ls.find(v=>v.key===pol.solveDriver); if(d) ls=[d];
  }
  return ls;
}
/* value a leaf would have at `period` from baseline + earlier anchors, i.e. ignoring
   this exact period's own anchor — a stable reference so a live drag doesn't drift. */
function stableCur(v,period){
  const o=model.ov&&model.ov[v.key];
  const had=o&&(period in o); let saved;
  if(had){ saved=o[period]; delete o[period]; }
  const base=inputVal(v,period,true);
  if(had){ if(!model.ov[v.key]) model.ov[v.key]={}; model.ov[v.key][period]=saved; }
  return base;
}
function outAt(key,period){ return (evalModel(true)[key]||[])[period]||0; }

function applyDrag(key,period,target){
  const v=vget(key); if(!v) return;
  if(period < (model.closed|0)){ _solveMsg='Closed months are locked.'; return; }
  if(v.kind==='input'){ setOv(key,period,target); _solveMsg=''; _lastDragXray=null; return; }
  const ok=backsolvePeriod(key,period,target);
  if(ok && v.kind==='formula') _lastDragXray={key,period};
  else if(!ok) _lastDragXray=null;
}
function backsolvePeriod(key,period,target){
  const pol=lineSolvePolicy(key);
  const mode=pol.mode||'proportional';
  const leaves=freeLeavesOf(key);
  if(!leaves.length){ _solveMsg='All drivers of this line are pinned — release one to plan it.'; return false; }
  const cur=leaves.map(v=>stableCur(v,period));

  /* P3: exact closed-form for pure multiply/divide (monomial) trees */
  if(mode==='proportional' || mode==='single'){
    const exact=tryExactBacksolve(key,period,target,leaves,mode);
    if(exact.ok && exact.hit){ _solveMsg='Exact breakback (×÷).'; return true; }
    /* if algebraic path missed due to decimal rounding, fall through to bisection */
    if(exact.ok && !exact.hit){ leaves.forEach((v,i)=>setOv(v.key,period,cur[i])); }
  }

  if(mode==='balanced'){
    // damped Newton: Δxᵢ = gᵢ·(target−y)/Σgⱼ² , iterate, halve step on overshoot
    leaves.forEach((v,i)=>setOv(v.key,period,cur[i]));           // start from stable base
    let prev=Infinity;
    for(let it=0;it<60;it++){
      const y=outAt(key,period), res=target-y;
      if(Math.abs(res)<=Math.max(1e-6,Math.abs(target)*1e-7)){ _solveMsg=''; return true; }
      const g=leaves.map(v=>{ const x0=inputVal(v,period,true), eps=Math.max(1e-4,Math.abs(x0)*1e-4);
        setOv(v.key,period,x0+eps); const yp=outAt(key,period); setOv(v.key,period,x0); return (yp-y)/eps; });
      const g2=g.reduce((s,x)=>s+x*x,0);
      if(g2<1e-20){ _solveMsg='These drivers barely move this line — try another driver or unpin one.'; return false; }
      let damp=1; if(Math.abs(res)>prev) damp=0.5; prev=Math.abs(res);
      leaves.forEach((v,i)=>{ const x0=inputVal(v,period,true); setOv(v.key,period,x0+g[i]*res/g2*damp); });
    }
    const y=outAt(key,period); _solveMsg = Math.abs(y-target)>Math.max(1,Math.abs(target)*1e-4)?`Closest reachable: ${fmtVar(y,vget(key).unit)} (drivers maxed out).`:''; return true;
  }

  // proportional / single fallback: common factor r on the free leaves, bisected
  if(cur.every(x=>Math.abs(x)<1e-12)){ _solveMsg='These drivers are zero at this month — nothing to scale. Set a base or pick another driver.'; return false; }
  const f=r=>{ leaves.forEach((v,i)=>setOv(v.key,period,cur[i]*r)); return outAt(key,period); };
  let lo=0.0001,hi=8,flo=f(lo),fhi=f(hi), tries=0;
  while(((fhi>flo)?(fhi<target):(fhi>target)) && tries<50){ hi*=1.6; fhi=f(hi); tries++; }   // expand to bracket
  if(flo===fhi){ leaves.forEach((v,i)=>setOv(v.key,period,cur[i])); _solveMsg='This line doesn’t respond to these drivers — check the formula tree or pins.'; return false; }
  for(let it=0;it<54;it++){ const mid=(lo+hi)/2,val=f(mid); if((fhi>flo)?val<target:val>target) lo=mid; else hi=mid; }
  const r=(lo+hi)/2; const y=f(r);
  _solveMsg = Math.abs(y-target)>Math.max(1,Math.abs(target)*1e-4)?`Closest reachable: ${fmtVar(y,vget(key).unit)}.`:'';
  return true;
}

/* ============================ VARIANCE ANALYSIS ============================
   Compare any two versions (Plan / Scenario / Actuals) and explain the gap.
   The bridge decomposes a line's variance into DRIVER contributions using
   successive substitution — swap each driver from reference to comparison,
   one at a time, and attribute the step. Works through the whole formula tree
   for driver-based models, and degrades to a plain line variance for flat ones.
   Favourable/Unfavourable respects each line's "good direction". */
function hasActuals(){ return model.vars.some(v=>v.actuals&&v.actuals.some(x=>x!=null&&x!=='')); }
function hasForecastSrc(){ return model.vars.some(v=>v.forecast&&v.forecast.some(x=>x!=null&&x!=='')); }
/* last period (inclusive) that has any actual recorded, else -1 */
function lastActualIdx(){ let m=-1; model.vars.forEach(v=>{ if(v.actuals) for(let p=0;p<v.actuals.length;p++) if(v.actuals[p]!=null&&v.actuals[p]!=='') m=Math.max(m,p); }); return m; }
const PRIOR_LABEL={1:'Previous month',3:'Previous quarter',12:'Previous year'};
function versionData(which,ctxA){
  if(which==='scenario') return evalModel(true);
  if(which==='plan') return evalModel(false);
  if(which==='forecast'){   // read forecast series where present, else the driver model's plan
    const plan=evalModel(false), n=P(), res={};
    model.vars.forEach(v=>{ res[v.key]=Array.from({length:n},(_,p)=> (v.forecast&&v.forecast[p]!=null&&v.forecast[p]!=='')?Number(v.forecast[p]):plan[v.key][p]); });
    return res;
  }
  if(which==='actual'){    // actuals ONLY — null where no actual is recorded (never plan-filled)
    const n=P(), res={};
    model.vars.forEach(v=>{ res[v.key]=Array.from({length:n},(_,p)=> (v.actuals&&v.actuals[p]!=null&&v.actuals[p]!=='')?Number(v.actuals[p]):null); });
    return res;
  }
  if(which==='prior'){ const N=_vState.priorN||1, src=ctxA||evalModel(true), n=P(), res={};
    model.vars.forEach(v=>{ res[v.key]=Array.from({length:n},(_,p)=> p-N>=0?src[v.key][p-N]:null); }); return res; }
  if(which&&which.slice(0,2)==='v:'){ // use stored series for variance stability; applyScenarioFork restores live drivers
    const ver=(model.versions||[]).find(x=>x.id===which.slice(2)), n=P(), res={};
    model.vars.forEach(v=>{ const arr=(ver&&ver.data&&ver.data[v.key])||[]; res[v.key]=Array.from({length:n},(_,p)=>arr[p]!=null?arr[p]:0); }); return res; }
  return evalModel(false);
}
/* does this version have real data for this line within the window? */
function versionHasData(which,key,win){
  if(which==='actual'){ const v=vget(key); if(!v||!v.actuals) return false; for(let p=win[0];p<=win[1];p++) if(v.actuals[p]!=null&&v.actuals[p]!=='') return true; return false; }
  return true;
}
function verLabel(which){
  if(which==='plan')return 'Plan (baseline)'; if(which==='scenario')return 'Scenario (your plan)';
  if(which==='forecast')return 'Forecast (from sheet)';
  if(which==='actual')return 'Actuals'; if(which==='prior')return PRIOR_LABEL[_vState.priorN||1]||'Prior period';
  if(which&&which.slice(0,2)==='v:'){ const v=(model.versions||[]).find(x=>x.id===which.slice(2)); return v?(v.name+(v.drivers?' (fork)':'')):'(deleted version)'; }
  return which;
}
function verShort(which){ if(which&&which.slice(0,2)==='v:'){ const v=(model.versions||[]).find(x=>x.id===which.slice(2)); return v?(v.name.length>14?v.name.slice(0,13)+'…':v.name):'—'; } return {plan:'Plan',scenario:'Scenario',forecast:'Forecast',actual:'Actuals',prior:PRIOR_LABEL[_vState.priorN||1]||'Prior'}[which]||which; }
function goodDir(v){ return v.good||'up'; }
function isFav(v,variance){
  if(v.favOverride==='fav') return true;
  if(v.favOverride==='unf') return false;
  if(Math.abs(variance)<1e-9) return null;
  const g=goodDir(v); if(g==='neutral') return null;
  return g==='up' ? variance>0 : variance<0;
}
/* one control for both: direction (auto) + manual override */
function fuMode(v){ if(v.favOverride==='fav') return 'force_fav'; if(v.favOverride==='unf') return 'force_unf'; const g=goodDir(v); return g==='down'?'lower':g==='neutral'?'neutral':'higher'; }
function setFU(k,mode){ const v=vget(k); if(!v) return;
  if(mode==='force_fav'){ v.favOverride='fav'; } else if(mode==='force_unf'){ v.favOverride='unf'; }
  else { delete v.favOverride; v.good = mode==='lower'?'down':mode==='neutral'?'neutral':'up'; }
  saveModel(); renderVariance(); }
const FU_OPTS=[['higher','Higher is better'],['lower','Lower is better'],['neutral','Neutral (no F/U)'],['force_fav','Force favourable'],['force_unf','Force unfavourable']];

function applyScenarioFork(id){

function deleteVersion(id){ model.versions=(model.versions||[]).filter(v=>v.id!==id);

/* sum a variable over the active period window */
/* how a line rolls up over a period: flows sum, rates/stocks average (default by kind) */
const AGG_LABEL={sum:'Sum',avg:'Average',last:'Period-end'};
function aggMethod(v){
  if(v&&v.agg) return v.agg;
  if(!v) return 'sum';
  if(v.unit==='%' || isPriceLike(v)) return 'avg';
  if(v.kind==='input') return 'avg';
  return 'sum'; /* currency / volume outputs */
}
function aggArr(arr,method){
  if(!arr||!arr.length) return 0;
  if(method==='avg'){ const f=arr.filter(x=>x!=null); return f.length?f.reduce((a,b)=>a+b,0)/f.length:0; }
  if(method==='last'){ for(let i=arr.length-1;i>=0;i--) if(arr[i]!=null) return arr[i]; return 0; }
  return arr.reduce((a,b)=>a+(b||0),0);
}
function winArr(data,key,win){ const a=[]; for(let p=win[0];p<=win[1];p++) a.push((data[key]||[])[p]); return a; }
function vAgg(data,key,win){ return aggArr(winArr(data,key,win), aggMethod(vget(key))); }

/* per-period successive-substitution bridge, aggregated over the window by the line's method */
function bridge(key,A,B,win){
  const v=vget(key);
  if(!v) return {steps:[],start:0,end:0,residual:0};
  const m=aggMethod(v);
  if(v.kind!=='formula'){
    const st=vAgg(B,key,win), en=vAgg(A,key,win);
    return {start:st,end:en,steps:[{key:v.key,name:v.name,delta:en-st}],residual:0};
  }
  const c=compile(v.expr), deps=c.deps.map(d=>vget(d)).filter(Boolean);
  const startArr=[],endArr=[],stepArr={}; deps.forEach(d=>stepArr[d.key]=[]);
  for(let p=win[0];p<=win[1];p++){
    const val=(sub)=>{ const scope={}; deps.forEach(d=>{ scope[d.key.toLowerCase()]=(sub.has(d.key)?A:B)[d.key][p]; });
      return evalRPN(c.rpn,scope,{period:p, lookup:(key,q)=>{
        if(q<0) return 0;
        const sk=String(key).toLowerCase();
        if(q===p && (sk in scope)) return scope[sk];
        const useA=[...sub].some(k=>k.toLowerCase()===sk);
        const src=useA?A:B;
        const kk=Object.keys(src).find(x=>x.toLowerCase()===sk);
        if(!kk) return 0;
        const raw=(src[kk]||[])[q];
        return raw==null?0:raw;
      }}); };
    let prev=val(new Set()); startArr.push(prev); const used=new Set();
    deps.forEach(d=>{ used.add(d.key); const now=val(used); stepArr[d.key].push(now-prev); prev=now; });
    endArr.push(prev);
  }
  const start=aggArr(startArr,m), endComputed=aggArr(endArr,m), endActual=vAgg(A,key,win);
  return {start,end:endActual,steps:deps.map(d=>({key:d.key,name:d.name,delta:aggArr(stepArr[d.key],m)})),residual:endActual-endComputed};
}


/* ---- Wow helpers: period contributions + bridge narrative + Number X-ray ---- */
/** Single-period successive-substitution (thin wrapper around bridge). */
function periodContributions(key,A,B,period){
  const p=Math.max(0,Math.min(P()-1,period|0));
  return bridge(key,A,B,[p,p]);
}
/** Driver value snapshot for a period (for X-ray table). */
function driverPeriodVals(key,data,period){
  const v=vget(key); if(!v||v.kind!=='formula') return [];
  const deps=compile(v.expr||'').deps.map(d=>vget(d)).filter(Boolean);
  return deps.map(d=>({key:d.key,name:d.name,unit:d.unit,val:(data[d.key]||[])[period]}));
}
/**
 * Deterministic plain-English narrative from bridge steps.
 * Template: "vs [B], [line] is [fav/unfav] by ₹X. Mainly because [top drivers…]."
 */
function bridgeNarrative(opts){
  const line=opts.lineName||'Line', base=opts.baseLabel||'baseline';
  const tot=opts.totVar, fav=opts.fav, unit=opts.unit||'₹';
  const steps=(opts.steps||[]).filter(s=>Math.abs(s.delta)>1e-9).slice().sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  const fmt=opts.fmtDelta||((d,u)=>String(d));
  if(Math.abs(tot)<1e-9){
    return `vs ${base}, ${line} is flat — no material variance.`;
  }
  const verdict = fav===true ? 'favourable' : fav===false ? 'unfavourable' : (tot>=0?'up':'down');
  let s=`vs ${base}, ${line} is ${verdict} by ${fmt(tot,unit)}.`;
  if(!steps.length) return s;
  const top=steps.slice(0,3);
  const bits2=top.map(st=>`${st.name} (${fmt(st.delta,unit)})`);
  s+=` Mainly because ${bits2.join(', ')}.`;
  if(steps.length>3) s+=` Plus ${steps.length-3} smaller driver${steps.length-3>1?'s':''}.`;
  return s;
}

    ${formulaHtml}

}

const REASONS_DEFAULT=['Price change','Volume / demand','Mix shift','Timing / phasing','One-time / exceptional','FX / rate','Cost overrun','Cost saving','New / lost customer','Forecast revision','Data correction','Other'];
function allReasons(){ return REASONS_DEFAULT.concat((model.reasonCodes||[]).filter(r=>!REASONS_DEFAULT.includes(r))); }
function vnote(k){ return (model.vnotes&&model.vnotes[k])||{reason:'',remark:''}; }
function setReason(k,val){ if(val==='__add__'){ addReasonModal(k); return; } if(!model.vnotes)model.vnotes={}; (model.vnotes[k]=model.vnotes[k]||{reason:'',remark:''}).reason=val; saveModel(); renderVariance(); }

function commitReason(k){ const r=(document.getElementById('newReason').value||'').trim(); if(!r){ closeModal(); return; }
  if(!model.reasonCodes)model.reasonCodes=[]; if(!allReasons().includes(r)) model.reasonCodes.push(r);
  if(!model.vnotes)model.vnotes={}; (model.vnotes[k]=model.vnotes[k]||{reason:'',remark:''}).reason=r; closeModal(); saveModel(); renderVariance(); }
function setMat(v){ model.matThresh=+v||0; saveModel(); renderVariance(); }

let _vState={A:'scenario',B:'plan',line:null,win:null,priorN:1};

/* ============================ ROLL-FORWARD SUGGESTIONS (P1) ============================ */
/* CFO lock: obs min/max/mid vs plan; Apply=obs_mid (or Custom scalar) on all open future periods;
   Keep=no override + required reason; audit trail; reuse setOv. */
function ensureRollForwardLog(){
  if(!Array.isArray(model.rollForwardLog)) model.rollForwardLog=[];
  return model.rollForwardLog;
}
function openFuturePeriods(){
  const closed=Math.max(0, model.closed|0);
  const out=[];
  for(let p=closed;p<P();p++) out.push(p);
  return out;
}
function rfFmt(v, unit){
  if(unit==='%') return ((Number(v)||0)*100).toFixed(2)+'%';
  try{ return fmtVar(Number(v)||0, unit||''); }catch(e){ return String(v); }
}
function collectRollForwardSuggestions(win){
  const w=win||(_vState.win||[0,Math.max(0,P()-1)]);
  const plan=versionData('plan');
  const futures=openFuturePeriods();
  if(!futures.length) return [];
  const matPct=Math.max(0.05, (model.matThresh||5)/100);
  const out=[];
  inputs().forEach(v=>{
    if(!v || v.writable===false && !(v.actuals&&v.actuals.length)) {
      /* still allow writable inputs; skip non-writable without actuals */
    }
    if(v.writable===false) return; /* only drivers we can override */
    const vals=[];
    for(let p=w[0];p<=w[1];p++){
      if(v.actuals&&v.actuals[p]!=null&&v.actuals[p]!=='') vals.push(Number(v.actuals[p]));
    }
    if(!vals.length) return;
    const obs_min=Math.min(...vals), obs_max=Math.max(...vals);
    const obs_mid=(obs_min+obs_max)/2;
    const planVals=[];
    for(let p=w[0];p<=w[1];p++){
      if(!(v.actuals&&v.actuals[p]!=null&&v.actuals[p]!=='')) continue;
      const pv=(plan[v.key]||[])[p];
      if(pv!=null&&pv!==''&&Number.isFinite(Number(pv))) planVals.push(Number(pv));
    }
    if(!planVals.length){
      const pv=(plan[v.key]||[])[w[1]];
      if(pv==null||pv===''||!Number.isFinite(Number(pv))) return;
      planVals.push(Number(pv));
    }
    const plan_value=planVals.reduce((a,b)=>a+b,0)/planVals.length;
    const outside=plan_value<obs_min-1e-12 || plan_value>obs_max+1e-12;
    const denom=Math.max(Math.abs(plan_value), Math.abs(obs_mid), 1e-9);
    const material=Math.abs(plan_value-obs_mid)/denom >= matPct;
    if(!outside && !material) return;
    out.push({
      driver_id:v.key, name:v.name, unit:v.unit||'',
      obs_min, obs_max, obs_mid, plan_value,
      periods_open:futures.slice()
    });
  });
  out.sort((a,b)=>Math.abs(b.plan_value-b.obs_mid)-Math.abs(a.plan_value-a.obs_mid));
  return out;
}
function rfToneVerb(s){
  if(s.plan_value>s.obs_max) return 'tone future periods down';
  if(s.plan_value<s.obs_min) return 'tone future periods up';
  return 'rebase future periods to the observed mid';
}
function renderRollForward(){
  const el=document.getElementById('vRollForward'); if(!el) return;
  if(!hasActuals()){
    el.innerHTML=`<div class="rf-wrap"><div class="rf-head"><div><p class="eyebrow" style="margin:0 0 4px">Roll-forward</p><h2 style="font-size:16px;margin:0">Learnings → next forecast</h2></div></div>
      <p class="rf-empty">Load actuals to unlock roll-forward suggestions. Map actuals cells, refresh actuals, then return here.</p></div>`;
    return;
  }
  const win=_vState.win||[0,P()-1];
  const suggestions=collectRollForwardSuggestions(win);
  const futures=openFuturePeriods();
  const winLabel = win[0]===win[1]? (model.periods[win[0]]||'') : `${(model.periods[win[0]]||'').split(' ')[0]}–${(model.periods[win[1]]||'').split(' ')[0]}`;
  const cards=suggestions.length? suggestions.map(s=>{
    const rangeTxt = s.obs_min===s.obs_max ? rfFmt(s.obs_mid,s.unit) : `${rfFmt(s.obs_min,s.unit)} – ${rfFmt(s.obs_max,s.unit)}`;
    return `<div class="rf-card" data-driver="${esc(s.driver_id)}">
      <h3>${esc(s.name)} <span class="keychip">${esc(s.driver_id)}</span></h3>
      <p class="rf-meta">Observed ${esc(s.name.toLowerCase())} ran <b>${rangeTxt}</b> in ${esc(winLabel)} vs <b>${rfFmt(s.plan_value,s.unit)}</b> in the plan. ${rfToneVerb(s)} to <b>${rfFmt(s.obs_mid,s.unit)}</b> for ${s.periods_open.length} open future period${s.periods_open.length===1?'':'s'}?</p>
      <div class="rf-stats">
        <div class="rf-stat"><label>Obs min</label><b>${rfFmt(s.obs_min,s.unit)}</b></div>
        <div class="rf-stat"><label>Obs max</label><b>${rfFmt(s.obs_max,s.unit)}</b></div>
        <div class="rf-stat"><label>Obs mid</label><b>${rfFmt(s.obs_mid,s.unit)}</b></div>
        <div class="rf-stat"><label>Plan</label><b>${rfFmt(s.plan_value,s.unit)}</b></div>
      </div>
      <div class="rf-actions">
        <button class="btn primary sm" onclick="rollForwardApply('${jesc(s.driver_id)}')">Apply to open forecast</button>
        <button class="btn sm" onclick="rollForwardKeepPrompt('${jesc(s.driver_id)}')">Keep plan</button>
        <button class="btn sm" onclick="rollForwardCustomPrompt('${jesc(s.driver_id)}')">Custom…</button>
      </div>
      <div class="rf-reason" id="rfReason_${esc(s.driver_id)}" style="display:none"></div>
    </div>`;
  }).join('') : `<p class="rf-empty">No material driver gaps in this window — plan sits inside observed ranges (or within materiality). Widen the period window or refresh actuals if you expected prompts.</p>`;

  el.innerHTML=`<div class="rf-wrap">
    <div class="rf-head">
      <div><p class="eyebrow" style="margin:0 0 4px">Roll-forward</p>
        <h2 style="font-size:16px;margin:0">Bake variance into the open forecast</h2>
        <p class="mut fz12" style="margin:6px 0 0;max-width:560px">Suggestions use actuals in <b>${esc(winLabel)}</b> only. Apply writes one scalar to open future periods (from closed month ${model.closed|0} onward) — never into closed actuals.</p></div>
      <div class="mut fz11">${futures.length? futures.length+' open period'+(futures.length===1?'':'s') : 'No open future periods — raise timeline or lower “Closed / actual so far”'}</div>
    </div>
    ${cards}
  </div>`;
}
function rfFindSuggestion(driver_id){
  const win=_vState.win||[0,P()-1];
  return collectRollForwardSuggestions(win).find(s=>s.driver_id===driver_id)||null;
}
function rollForwardAudit(entry){
  ensureRollForwardLog().push(Object.assign({timestamp:new Date().toISOString()}, entry));
  saveModel();
}
function rollForwardApply(driver_id){
  const s=rfFindSuggestion(driver_id); if(!s){ toast('Suggestion no longer available'); renderRollForward(); return; }
  const periods=s.periods_open.slice();
  periods.forEach(p=>setOv(driver_id, p, s.obs_mid));
  rollForwardAudit({
    driver_id, obs_min:s.obs_min, obs_max:s.obs_max, obs_mid:s.obs_mid, plan_value:s.plan_value,
    action:'apply', applied_value:s.obs_mid, reason:'', periods_touched:periods
  });
  saveModel(); renderVariance(); toast('Applied '+s.name+' → open forecast');
}
function rollForwardKeepPrompt(driver_id){

}
function rollForwardKeep(driver_id){

function rollForwardCustomPrompt(driver_id){

function rollForwardCustom(driver_id){

/* auto-pick the most useful comparison until the user overrides it with the dropdowns.
   With actuals loaded → Actuals vs Forecast (so real variance shows); otherwise Scenario vs Plan. */
function autoDefaultVer(){
  if(_vState.userVer){   // user chose explicitly — respect it, just keep it valid
    if(_vState.A==='actual'&&!hasActuals()) _vState.A='scenario';
    if(_vState.B==='actual'&&!hasActuals()) _vState.B='plan';
    return;
  }
  if(hasActuals()){
    _vState.A='actual'; _vState.B=hasForecastSrc()?'forecast':'plan';
    const la=lastActualIdx(); if(la>=0 && !_vState.winUser) _vState.win=[0,la];
  } else {
    if(_vState.A==='actual') _vState.A='scenario';
    if(_vState.B==='actual') _vState.B='plan';
  }
}
function mountVariance(){
  if(!_vState.win) _vState.win=[0,P()-1];
  if(_vState.win[1]>P()-1) _vState.win=[0,P()-1];
  autoDefaultVer();
  // prefer the terminal output — a formula/output that nothing else feeds into
  const fed=new Set(); model.vars.forEach(v=>{ if(v.kind==='formula') compile(v.expr||'').deps.forEach(d=>fed.add(d.toLowerCase())); });
  const terminal=model.vars.filter(v=>v.kind!=='input'&&!fed.has(v.key.toLowerCase()));
  const prefer=terminal[terminal.length-1]||model.vars.find(v=>v.kind==='formula')||model.vars[0];
  if(!_vState.line||!vget(_vState.line)) _vState.line=prefer?prefer.key:null;
  renderVariance();
}
function setVer(side,val){ _vState.userVer=true; _vState[side]=val; if(_vState.A===_vState.B){ _vState.B = _vState.A==='plan'?'scenario':'plan'; } saveModel(); renderVariance(); }
function setVWin(v){ _vState.winUser=true; if(v==='all') _vState.win=[0,P()-1]; else { const p=+v; _vState.win=[p,p]; } saveModel(); renderVariance(); }
function pickVLine(k){ _vState.line=k; renderVariance(); }
function toggleGood(k){ const v=vget(k); v.good=goodDir(v)==='up'?'down':'up'; renderVariance(); saveModel(); }

function setVerPrior(n){ _vState.priorN=+n; saveModel(); renderVariance(); }
function ragOf(r){ if(Math.abs(r.d)<1e-9||r.b===0) return 'na'; if(r.fav) return 'g'; return Math.abs(r.pct)>=10?'r':'a'; }
const RAG_TITLE={g:'On track / favourable',a:'Watch — moderate unfavourable',r:'Alert — large unfavourable',na:'No material variance'};

      <td class="num xclick ${r.d>0?'pos':r.d<0?'negv':''}" title="X-ray" onclick="event.stopPropagation();openXray({key:'${r.v.key}',period:${win[0]===win[1]?win[0]:win[1]},whichA:'${_vState.A}',whichB:'${_vState.B}'})">${r.d==null?'<span class="mut" title="No actual recorded for this line">no actual</span>':r.d===0?'—':fmtDelta(r.d,r.v.unit)}</td>
      <td class="num mut">${r.pct!=null&&r.b?(r.pct>=0?'+':'')+r.pct.toFixed(1)+'%':'—'}</td>

      <td class="rowacts"><button class="cbtn ${nt.remark?'has':''}" title="${nt.remark?'Commentary: '+esc(nt.remark):'Commentary & line settings'}" onclick="event.stopPropagation();openCommentary('${r.v.key}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button><button class="cbtn del" title="Remove line" onclick="event.stopPropagation();deleteLine('${r.v.key}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button></td>
    </tr>`; }).join('');
  document.getElementById('vControls').innerHTML=`
    <div class="selrow2">
      <div class="field"><label>Compare</label><select onchange="setVer('A',this.value)">${opts(_vState.A,false)}</select></div>

/* variance-per-period sparkline for the selected line (green=fav, red=unfav) */
function varSpark(key,A,B,win){
  const v=vget(key), n=P(); const d=[];
  for(let p=0;p<n;p++){ const bv=(B[key]||[])[p], av=(A[key]||[])[p]; d.push((bv==null||av==null)?null:av-bv); }
  const vals=d.filter(x=>x!=null); if(!vals.length) return '';
  const hi=Math.max(0,...vals), lo=Math.min(0,...vals), rng=(hi-lo)||1, H=44, W=100/n, zeroY=hi/rng*H;
  let bars=''; d.forEach((x,p)=>{ if(x==null) return; const fav=isFav(v,x), h=Math.abs(x)/rng*H, y=x>=0?zeroY-h:zeroY;
    const inWin=p>=win[0]&&p<=win[1];
    bars+=`<rect x="${(p*W+W*0.16).toFixed(2)}" y="${y.toFixed(2)}" width="${(W*0.68).toFixed(2)}" height="${Math.max(0.6,h).toFixed(2)}" fill="${Math.abs(x)<1e-9?'#c9cede':fav?'#3aa981':'#e06a6a'}" opacity="${inWin?1:0.38}"/>`; });
  const every=Math.ceil(n/6);
  return `<div class="sparkbox"><div class="sparktitle">Variance over time <span class="mut">· ${verShort(_vState.A)} − ${verShort(_vState.B)}</span></div>
    <svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" class="vspark"><line x1="0" y1="${zeroY.toFixed(2)}" x2="100" y2="${zeroY.toFixed(2)}" stroke="#d5d9e4" stroke-width="0.5"/>${bars}</svg>
    <div class="sparkx">${model.periods.map((m,i)=>`<span style="${i%every?'visibility:hidden':''}">${m.split(' ')[0]}</span>`).join('')}</div></div>`;
}
function renderBridge(A,B,win,winLabel){
  const el=document.getElementById('vBridge'); if(!el) return;
  const v=vget(_vState.line); if(!v){ el.innerHTML='<p class="mut">Pick a line on the left.</p>'; return; }
  if(!versionHasData(_vState.A,_vState.line,win)||!versionHasData(_vState.B,_vState.line,win)){
    const missing = !versionHasData(_vState.A,_vState.line,win)?verShort(_vState.A):verShort(_vState.B);
    el.innerHTML=`<div class="results-head"><div><p class="eyebrow">Driver bridge · ${winLabel}</p><h2 style="font-size:16px">${v.name}</h2></div></div><p class="mut fz13" style="margin:10px 0 0">No <b>${missing}</b> figures recorded for ${v.name} in this period, so there's nothing to bridge. Pick a line that has actuals, or map this line's actuals cell.</p>`;
    return;
  }
  const note=vnote(_vState.line);
  const br=bridge(_vState.line,A,B,win);
  const totVar=br.end-br.start, fav=isFav(v,totVar);
  const parts=br.steps.filter(s=>Math.abs(s.delta)>1e-9).slice().sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  if(Math.abs(br.residual)>Math.max(1,Math.abs(br.end)*1e-4)) parts.push({key:'__resid',name:'Other / unexplained',delta:br.residual});
  const isFlat=v.kind!=='formula';

  // waterfall geometry
  const vals=[br.start].concat(parts.map(p=>p.delta)); let run=br.start; const bars=[];
  parts.forEach(p=>{ bars.push({name:p.name,key:p.key,from:run,to:run+p.delta,delta:p.delta}); run+=p.delta; });
  const allY=[br.start,br.end].concat(bars.flatMap(b=>[b.from,b.to])); let lo=Math.min(0,...allY),hi=Math.max(...allY,0); const pad=(hi-lo)*0.08||1; lo-=pad; hi+=pad;
  const H=210,BW=100,gap=16, n=parts.length+2, Wc=Math.max(560,(BW+gap)*n+40);
  const X=i=>28+i*(BW+gap), Y=val=>H-(val-lo)/((hi-lo)||1)*H;
  const bar=(i,from,to,cls,label,val)=>{ const y0=Y(Math.max(from,to)),y1=Y(Math.min(from,to)); return `<g><rect x="${X(i)}" y="${y0}" width="${BW}" height="${Math.max(2,y1-y0)}" rx="3" class="wf ${cls}"/><text class="wfv" x="${X(i)+BW/2}" y="${y0-6}" text-anchor="middle">${label}</text></g>`; };
  let svg=`<svg viewBox="0 0 ${Wc} ${H+46}" style="width:100%;min-width:${Wc}px">`;
  svg+=bar(0,lo,br.start,'base','',0)+`<text class="wfx" x="${X(0)+BW/2}" y="${H+16}" text-anchor="middle">${verShort(_vState.B)}</text><text class="wfb" x="${X(0)+BW/2}" y="${H+32}" text-anchor="middle">${fmtVar(br.start,v.unit)}</text>`;
  // connector + step bars
  bars.forEach((b,idx)=>{ const i=idx+1; const up=b.delta>=0; svg+=bar(i,b.from,b.to,up?'up':'down',fmtDelta(b.delta,v.unit),b.delta);
    svg+=`<line class="wfc" x1="${X(i-1)+BW}" y1="${Y(b.from)}" x2="${X(i)}" y2="${Y(b.from)}"/>`;
    const short=b.name.length>16?b.name.slice(0,15)+'…':b.name;
    svg+=`<text class="wfx" x="${X(i)+BW/2}" y="${H+16}" text-anchor="middle">${short}</text>`;
    if(b.key!=='__resid'&&vget(b.key)&&vget(b.key).kind==='formula') svg+=`<text class="wfdrill" x="${X(i)+BW/2}" y="${H+31}" text-anchor="middle" onclick="pickVLine('${b.key}')">drill ›</text>`; });
  const li=parts.length+1; svg+=bar(li,lo,br.end,'end','',0)+`<line class="wfc" x1="${X(li-1)+BW}" y1="${Y(bars.length?bars[bars.length-1].to:br.start)}" x2="${X(li)}" y2="${Y(bars.length?bars[bars.length-1].to:br.start)}"/><text class="wfx" x="${X(li)+BW/2}" y="${H+16}" text-anchor="middle">${verShort(_vState.A)}</text><text class="wfb" x="${X(li)+BW/2}" y="${H+32}" text-anchor="middle">${fmtVar(br.end,v.unit)}</text>`;
  svg+=`</svg>`;

  const narr=bridgeNarrative({lineName:v.name, baseLabel:verShort(_vState.B), totVar, fav, unit:v.unit, steps:parts, fmtDelta});
  const xPer = (win[0]===win[1])?win[0]:win[1];
  const xrayBtn=(side,val)=>`onclick="event.stopPropagation();openXray({key:'${v.key}',period:${xPer},whichA:'${_vState.A}',whichB:'${_vState.B}'})"`;
  el.innerHTML=`
    <div class="results-head"><div><p class="eyebrow">Driver bridge · ${winLabel}</p><h2 style="font-size:16px">${v.name}: ${verShort(_vState.B)} → ${verShort(_vState.A)}</h2></div></div>
    <div class="bridgenarr">${esc(narr)}</div>
    <div class="kpi-row" style="margin:10px 0 14px">
      <div class="xclick" ${xrayBtn('B')} title="X-ray this number"><span>${verShort(_vState.B)}</span><strong>${fmtVar(br.start,v.unit)}</strong></div>
      <div class="xclick" ${xrayBtn('A')} title="X-ray this number"><span>${verShort(_vState.A)}</span><strong>${fmtVar(br.end,v.unit)}</strong></div>
      <div class="xclick" ${xrayBtn('D')} title="X-ray variance drivers"><span>Variance</span><strong class="${totVar>0?'pos':totVar<0?'negv':''}">${fmtDelta(totVar,v.unit)}</strong>${fav!=null?`<small class="${fav?'pos':'negv'}">${fav?'Fav':'Unfav'}</small>`:''}</div>
    </div>
    ${varSpark(_vState.line,A,B,win)}
    ${isFlat?`<p class="mut fz12" style="margin:8px 0 10px">${v.name} ${v.kind==='input'?'is an input':'is read straight from your sheet'}, so its variance is the change in the line itself — no drivers to decompose. ${v.kind==='input'?'':'Add a formula to break it into drivers, or '}pick a formula line below to see a driver bridge.</p>`:''}
    ${(note.reason||note.remark)?`<div class="bridgenote"><span class="rtag">${esc(note.reason||'tagged')}</span>${note.remark?`<span class="bnrem">${esc(note.remark)}</span>`:''}<button class="cdrill" onclick="openCommentary('${v.key}')">edit ›</button></div>`:''}
    <div class="scrollx"><div class="wfwrap">${svg}</div></div>
    ${parts.length?`<div class="contrib">${parts.map(p=>{ const drill=p.key!=='__resid'&&vget(p.key)&&vget(p.key).kind==='formula'; return `<div class="crow"><span class="cdot ${p.delta>=0?'up':'down'}"></span><span class="cn">${p.name}${drill?` <button class="cdrill" onclick="pickVLine('${p.key}')">drill in ›</button>`:''}</span><span class="cv ${p.delta>=0?'pos':'negv'}">${fmtDelta(p.delta,v.unit)}</span><span class="cp mut">${totVar!==0?(p.delta/totVar*100).toFixed(0)+'% of gap':''}</span></div>`; }).join('')}</div>`:''}
  `;
}

function mountCompare(){

function setCLine(k){ _cState.line=k; renderCompare(); }
function setCBase(k){ _cState.base=k; if(_cState.cmp===k)_cState.cmp=projVersions().find(x=>x!==k)||'scenario'; renderCompare(); }
function setCCmp(k){ _cState.cmp=k; if(_cState.base===k)_cState.base=projVersions().find(x=>x!==k)||'plan'; renderCompare(); }

function cinemaChartSvg(line, baseArr, cmpArr, scrub){
  const n=P(), W=720, H=200, padL=36, padR=16, padT=16, padB=28, iw=W-padL-padR, ih=H-padT-padB;
  const all=baseArr.concat(cmpArr).filter(x=>x!=null&&isFinite(x));
  let lo=all.length?Math.min(...all):0, hi=all.length?Math.max(...all):1;
  if(hi-lo<1e-9){ const c=Math.abs(hi)||1; lo-=c*0.4; hi+=c*0.4; } else { const pad=(hi-lo)*0.12; lo-=pad; hi+=pad; }
  const X=i=>padL+iw*(n<=1?0.5:i/(n-1));
  const Y=v=>padT+ih*(1-(v-lo)/((hi-lo)||1));
  let ghost='';
  for(let i=0;i<n-1;i++){
    const b0=baseArr[i],b1=baseArr[i+1],c0=cmpArr[i],c1=cmpArr[i+1];
    if([b0,b1,c0,c1].some(x=>x==null||!isFinite(x))) continue;

  }
  const pathOf=arr=>{ let d=''; arr.forEach((v,i)=>{ if(v==null||!isFinite(v)) return; d+=(d?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)+' '; }); return d; };
  const sx=X(scrub), play=`<line x1="${sx.toFixed(1)}" y1="${padT}" x2="${sx.toFixed(1)}" y2="${padT+ih}" stroke="var(--indigo)" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="${sx.toFixed(1)}" cy="${Y(cmpArr[scrub]||0).toFixed(1)}" r="5" fill="#fff" stroke="#3aa981" stroke-width="2"/><circle cx="${sx.toFixed(1)}" cy="${Y(baseArr[scrub]||0).toFixed(1)}" r="4" fill="#fff" stroke="var(--indigo)" stroke-width="2"/>`;
  const every=Math.max(1,Math.ceil(n/8));
  let axis=''; for(let i=0;i<n;i+=every) axis+=`<text x="${X(i).toFixed(1)}" y="${H-8}" font-size="9" fill="#8b93a8" text-anchor="middle">${(model.periods[i]||'').split(' ')[0]}</text>`;

}
function renderCompare(){
  const vers=projVersions(), win=_cState.win, line=vget(_cState.line); if(!line){ return; }
  const data={}; vers.forEach(k=>data[k]=versionData(k));

  const winLabel = win[0]===win[1]?model.periods[win[0]]:`${model.periods[win[0]].split(' ')[0]}–${model.periods[win[1]].split(' ')[0]}`;

/* ============================ PROMOTE SCENARIO TO SHEETS ============================ */
function levelArrayFromDriver(d,n,fallbackBase){
  if(d && d.ramp && d.ramp.on){
    const r=d.ramp, s=Math.max(0,Math.min(n-1,r.start|0)), m=Math.max(1,r.months|0),
      from=(r.from!=null?r.from:0), to=(r.to!=null?r.to:(d.base!=null?d.base:fallbackBase));
    const arr=new Array(n);
    for(let p=0;p<n;p++){ arr[p]= p<s?from : p>=s+m?to : from+(to-from)*((p-s+1)/m); }
    return arr;
  }
  const base=d&&d.base!=null?d.base:fallbackBase;
  const arr=new Array(n).fill(base!=null?base:0);
  (d&&d.steps||[]).slice().sort((a,b)=>a.from-b.from).forEach(st=>{ for(let p=st.from;p<n;p++) arr[p]=st.value; });
  return arr;
}
function scheduleFromDriver(d,n,fallbackBase){
  let arr=levelArrayFromDriver(d,n,fallbackBase);
  if(d&&d.phase&&d.phase.length) arr=arr.map((x,p)=>x*(d.phase[p]!=null?d.phase[p]:1));
  return arr;
}
/* Build input row for current working scenario OR a saved fork (drivers+ov), without mutating model. */
function scenRowForPromote(verId,v){
  const n=P();
  if(!verId) return scenRow(v);
  const ver=(model.versions||[]).find(x=>x.id===verId);
  if(!ver) return scenRow(v);
  const d=ver.drivers&&ver.drivers[v.key];
  const ovMap=(ver.ov&&ver.ov[v.key])||{};
  const sched=d?scheduleFromDriver(d,n,v.base):schedule(v);
  return Array.from({length:n},(_,p)=>{
    let a=-1; for(const k in ovMap){ const ap=+k; if(ap<=p && ap>a) a=ap; }
    const val=a>=0 ? ovMap[a]+(sched[p]-sched[a]) : sched[p];
    return +(Number(val)).toFixed(4);
  });
}
function promoteSourceLabel(verId){
  if(!verId) return 'Working scenario';
  const ver=(model.versions||[]).find(x=>x.id===verId);
  return ver?ver.name:'(missing version)';
}

      </div>
      <label class="lvopt" style="margin:12px 0 0;display:flex"><input type="radio" name="pmMode" value="pricing" onchange="document.getElementById('pmTabRow').style.display=''; document.getElementById('pmTab').value='Pricing'"><span><span class="t">C · Pricing tab</span><span class="d">Writes the dedicated <code>Pricing</code> sheet tab from the Pricing model (named fields, monthly grain).</span></span></label>

function promoteWrites(verId){
  return inputs().filter(v=>v.writable!==false && v.range).map(v=>({range:v.range, values:[ scenRowForPromote(verId,v) ], name:v.name, key:v.key}));
}
function promoteGrid(verId){
  const n=P();
  const header=['key','name','unit'].concat(model.periods.slice(0,n));
  const rows=[header];
  inputs().forEach(v=>{
    rows.push([v.key,v.name,v.unit].concat(scenRowForPromote(verId,v)));
  });
  return rows;
}
function safeSheetName(name){
  return String(name||'Scenario').replace(/[:\/?*\[\]]/g,'').slice(0,80) || 'Scenario';
}
function previewPromote(){

  } else {

      <p class="mut fz11" style="margin:8px 0">Preview (first 4 columns): <code>${esc(grid.slice(0,4).map(r=>r.slice(0,4).join(', ')).join(' · '))}</code></p>
      <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" onclick="confirmPromote()">Confirm tab dump</button></div>`;
  }
}
async function confirmPromote(){
  const verId=(document.getElementById('pmVer')||{}).value||'';
  const mode=(document.querySelector('input[name="pmMode"]:checked')||{}).value||'inputs';
  const fb=document.getElementById('pmFeedback'); if(!fb) return;
  const label=promoteSourceLabel(verId);
  if(mode==='inputs'){
    const writes=promoteWrites(verId).map(w=>({range:w.range, values:w.values}));
    if(!writes.length){ fb.innerHTML=`<div class="write-feedback" style="background:#fff0f1;color:#a33d4d">Nothing to write.</div>`; return; }
    if(!conn.connected){ fb.innerHTML=`<div class="write-feedback success">✓ Dry run OK — ${writes.length} assumption row(s) for “${esc(label)}”. Connect a sheet to write for real.</div>`; setTimeout(()=>{closeModal();toast('Promote dry-run complete');},1100); return; }
    fb.innerHTML=`<div class="write-feedback" style="background:#eef0fa;color:#3a4680">Writing promoted inputs…</div>`;
    try{
      const data=await fetch(conn.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:conn.token,action:'write',ssid:conn.ssid||'',writes})}).then(r=>r.json());
      if(!data.ok) throw new Error(data.error||'write failed');
      fb.innerHTML=`<div class="write-feedback success">✓ Promoted ${writes.length} input row(s) for “${esc(label)}”.</div>`;
      setTimeout(()=>{closeModal();toast('Scenario promoted');},1100);
    }catch(err){ fb.innerHTML=`<div class="write-feedback" style="background:#fff0f1;color:#a33d4d">Promote failed: ${esc(err.message||err)}</div>`; }
    return;
  }
  let tab=(document.getElementById('pmTab')||{}).value||'';
  if(!tab) tab=safeSheetName(label);
  const values=promoteGrid(verId);
  if(!conn.connected){ fb.innerHTML=`<div class="write-feedback success">✓ Dry run OK — would write tab “${esc(tab)}” (${values.length} rows). Connect + redeploy Code.gs to write for real.</div>`; setTimeout(()=>{closeModal();toast('Promote tab dry-run complete');},1100); return; }
  fb.innerHTML=`<div class="write-feedback" style="background:#eef0fa;color:#3a4680">Creating/writing tab “${esc(tab)}”…</div>`;
  try{
    const data=await fetch(conn.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:conn.token,action:'ensureSheet',ssid:conn.ssid||'',sheetName:tab,clear:true,values})}).then(r=>r.json());
    if(!data.ok) throw new Error(data.error||'ensureSheet failed — redeploy Code.gs with ensureSheet support');
    fb.innerHTML=`<div class="write-feedback success">✓ Wrote tab “${esc(data.sheet||tab)}” (${data.rows||values.length} rows) for “${esc(label)}”.</div>`;
    setTimeout(()=>{closeModal();toast('Scenario tab promoted');},1100);
  }catch(err){ fb.innerHTML=`<div class="write-feedback" style="background:#fff0f1;color:#a33d4d">Tab promote failed: ${esc(err.message||err)}. Redeploy Apps Script from this repo’s Code.gs, or use Option A (mapped inputs).</div>`; }
}

function scenRow(v){ return Array.from({length:P()},(_,p)=>+(inputVal(v,p,true)).toFixed(4)); }
function openWriteback(){
  const edited=inputs().filter(v=>v.writable!==false && hasOv(v.key));   // only inputs you actually changed
  const mapped=edited.filter(v=>v.range);
  if(!edited.length){
    showModal(`<div class="mhead"><h3>Review write-back</h3><button class="x" onclick="closeModal()">×</button></div>
      <div class="mbody"><p class="mut" style="margin:0">No scenario changes yet. Drag a point on the chart to change an assumption, then come back here to write it to your sheet.</p>
      <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn primary" onclick="closeModal()">Got it</button></div></div>`);
    return;
  }
  const tbl=edited.map(v=>{ const row=scenRow(v); const nEdit=Object.keys(model.ov[v.key]||{}).length;
    const lo=Math.min(...row), hi=Math.max(...row);
    const rng = lo===hi ? fmtVar(lo,v.unit) : `${fmtVar(lo,v.unit)} – ${fmtVar(hi,v.unit)}`;

function classifyConnectError(err, kind){
  const raw=String((err&&err.message)||err||'').trim();
  const m=raw.toLowerCase();
  const where=kind==='actuals'?'actuals sheet':(kind==='model'?'model sheet':'Apps Script');
  if(!raw) return `Couldn’t reach the ${where}. Check the URL and try again.`;
  if(/invalid|malformed|url/.test(m) && /script|http|exec/.test(m)) return 'That Apps Script URL doesn’t look right. Paste the full /exec web app URL.';
  if(/401|403|unauthor|forbidden|token|permission|access denied|not allowed/.test(m)) return 'Bad token or no permission. Re-check the secret token and that the script can open this Google Sheet.';
  if(/404|not found|missing|no spreadsheet|unable to open|does not exist/.test(m)) return `Sheet not found or unreachable (${where}). Check the URL/ID and sharing with the script’s Google account.`;
  if(/network|failed to fetch|load failed|cors|timeout|unreachable/.test(m)) return `Couldn’t reach Google (${where}). Check the Apps Script deployment (Anyone access) and your network, then retry.`;
  if(/actuals/.test(kind||'') || kind==='actuals') return `Actuals sheet failed: ${raw}. Nothing was connected — fix actuals or clear that field.`;
  return `Couldn’t connect: ${raw}`;
}

}

async function doConnect(){

    const mapped=model.vars.filter(v=>v.range);
    let maxN=0;

      catch(e){ data=await gasReadRanges(ranges,{url,token,ssid,includeFormulas:false}); }
      if(!data||!data.ok) throw new Error((data&&data.error)||'Model sheet read failed');

        const raw=(data.values[v.range]&&data.values[v.range][0])||[];
        let N=raw.length; while(N>0&&(raw[N-1]===''||raw[N-1]==null))N--;
        const arr=raw.slice(0,N).map(x=>toNum(x,scale));
        const fraw=(data.formulas&&data.formulas[v.range]&&data.formulas[v.range][0])||[];
        const f0=String((fraw[0]==null?'':fraw[0])).trim();
        if(f0) v.sheetFormula=f0;
        if(v.kind==='output'){ v.read=arr; }
        else if(v.kind==='input'){ if(arr.length){ v.base=arr[0]; v.steps=[]; for(let i=1;i<arr.length;i++) if(Math.abs(arr[i]-arr[i-1])>1e-9) v.steps.push({from:i,value:arr[i]}); } }
        else if(v.kind==='formula' && arr.length){ v.read=arr; }
        maxN=Math.max(maxN,N);
      });
      if(maxN>0 && maxN!==P()){ model.periods=genMonths(maxN,startMonthIdx(),startYear()); }
    } else if(!listOk){
      errKind='model';
      const t=await fetch(`${url}?action=read&token=${encodeURIComponent(token)}${sq}&ranges=`,{redirect:'follow'}).then(r=>{
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      });
      if(!t||!t.ok) throw new Error((t&&t.error)||'connection failed');
      sheetName=sheetName||t.spreadsheet||"";
    }

    if(actualsRaw){
      errKind='actuals';
      const l=await fetch(`${url}?action=list&token=${encodeURIComponent(token)}&ssid=${encodeURIComponent(actualsSsid)}`,{redirect:'follow'}).then(r=>{
        if(!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      });
      if(!(l&&l.ok)) throw new Error((l&&l.error)||'Actuals sheet could not be opened');
      var actualsSheets=l.sheets||[];
      var actualsName=l.spreadsheet||"";
    } else {
      var actualsSheets=[];
      var actualsName="";
    }

    conn={connected:true,url,token,scale,ssid,sheets,actualsSsid:actualsRaw?actualsSsid:'',actualsSheets};
    saveConn(); setStatus(sheetName||'Connected',true);
    const tabsMsg = sheets.length?` · ${sheets.length} tab(s)`:'';
    const actMsg = actualsRaw?` · Actuals “${actualsName||'linked'}”`:'';
    const mapMsg = mapped.length?` · ${mapped.length} mapped line(s)`:'';
    fb.innerHTML=`<div class="write-feedback" style="background:#eef0fa;color:#3a4680">Connected — scanning to place cells automatically…</div>`;
    try{
      const tabEl=document.getElementById('cnTab');
      const ing=await ingestFromConnectedSheet({tab:(tabEl&&tabEl.value)||''});
      fb.innerHTML=`<div class="write-feedback success">✓ Connected &amp; scanned “${ing.name||sheetName||'your sheet'}” · ${ing.catalog} lines placed${ing.keepMatched?` · ${ing.keepMatched} drivers matched`:''}${tabsMsg}${actMsg}</div>`;
      setTimeout(()=>{closeModal();render(); toast((ing.mode==='formula-graph'?'Formula graph: ':'')+ing.catalog+' cells · '+(ing.inputs||0)+' inputs · '+(ing.formulas||0)+' formulas'+(ing.proof?' · proof '+ing.proof:''));},1100);
    }catch(scanErr){
      fb.innerHTML=`<div class="write-feedback success">✓ Connected to “${sheetName||'your sheet'}”${mapMsg}${tabsMsg}${actMsg}</div>
        <div class="conn-err" style="margin-top:8px">Scan did not finish: ${esc(String(scanErr.message||scanErr))}. Open Connect and use Scan &amp; load lines.</div>`;
      setTimeout(()=>{closeModal();render();},1800);
    }
  }catch(err){
    /* Roll back fully — never bind empty actuals or a half session */
    conn={connected:false,url,token:'',scale,ssid:ssid||'',sheets:[],actualsSsid:'',actualsSheets:[]};
    saveConn(); setStatus('Not connected', false); render();
    showErr(classifyConnectError(err, errKind));
  }
}

/* ============================ TWO-FILE IMPORT (forecast file + actuals file) ============================ */
function fmtPeriodLabel(h){
  if(h==null||h==='') return '';
  if(typeof h==='number' && h>=20000 && h<=80000){
    /* Excel serial date */
    const d=new Date(Date.UTC(1899,11,30)+Math.round(h)*86400000);
    if(!isNaN(d)) return MN[d.getUTCMonth()]+" ’"+String(d.getUTCFullYear()).slice(2);
  }
  const s=String(h).trim();
  if(/^\d+(\.\d+)?$/.test(s)){
    const n=parseFloat(s);
    if(n>=20000&&n<=80000){
      const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);
      if(!isNaN(d)) return MN[d.getUTCMonth()]+" ’"+String(d.getUTCFullYear()).slice(2);
    }
  }
  if(/^\d{4}-\d{2}-\d{2}([T ]|$)/.test(s)){
    const d=new Date(s); if(!isNaN(d)) return MN[d.getMonth()]+" ’"+String(d.getFullYear()).slice(2);
  }
  const m1=s.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[\s\-\/\'’]*(\d{2,4})$/i);
  if(m1){
    const mi=MN.findIndex(x=>x.toLowerCase()===m1[1].slice(0,3).toLowerCase());
    let y=m1[2]; if(y.length===4) y=y.slice(2);
    if(mi>=0) return MN[mi]+" ’"+y;
  }
  return s;
}
function nrm(s){ return String(s==null?'':s).toLowerCase().trim().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim(); }
function labelTokens(s){ return nrm(s).split(' ').filter(Boolean); }
/* Score how well a model var matches a scanned sheet line (higher = better). */
function labelMatchScore(v, line){
  if(!v||!line) return 0;
  const vn=nrm(v.name||''), vk=nrm((v.key||'').replace(/_/g,' ')), vm=nrm(v.metric||'');
  const ln=nrm(line.name||''), lm=nrm(line.metric||'');
  if(!ln && !lm) return 0;
  let score=0;
  if(vn && vn===ln) score+=100;
  if(vk && vk===ln) score+=95;
  if(vn && lm && vn===lm) score+=70;
  if(vm && lm && vm===lm) score+=40;
  if(vn && ln && (ln.includes(vn)||vn.includes(ln))) score+=55;
  if(vk && ln && (ln.includes(vk)||vk.includes(ln))) score+=50;
  const vt=new Set(labelTokens(v.name||'').concat(labelTokens(v.key||''.replace(/_/g,' '))));
  const lt=labelTokens(line.name||'');
  let overlap=0; lt.forEach(t=>{ if(vt.has(t) && t.length>2) overlap++; });
  score+=overlap*12;
  /* light key synonyms for Pricing drivers */
  const syn={
    paying_seats:[/paying seats|paid seats|\bseats\b|subscribers|customers/],
    usage_units:[/usage units|usage qty|usage quantity|consumption units/],
    price:[/\bprice\b|asp|arpu|price per/],
    seat_discount_pct:[/seat.*discount|discount.*seat/],
    usage_discount_pct:[/usage.*discount|discount.*usage/],
    contract_discount_pct:[/contract.*discount|discount.*contract/],
    promo_discount_pct:[/promo.*discount|discount.*promo/],
    discount_amount:[/flat discount|discount amount|\bdiscount\b/],
    list_revenue:[/list revenue|gross revenue|\brevenue\b/],
    revenue_total_net:[/net after waterfall|revenue total net|net after/],
    gross_revenue:[/gross revenue|list revenue/],
    net_revenue:[/net revenue/],
    direct_costs:[/direct cost|cogs|cost of/],
    gross_profit:[/gross profit/],
    gross_margin_pct:[/gross margin/]
  };
  const rules=syn[String(v.key||'').toLowerCase()];
  if(rules && rules.some(r=>r.test(ln)||r.test(lm+' '+ln))) score+=80;
  return score;
}
function bestLabelMatch(v, lines, usedIds){
  let best=null, bestScore=0;

  let li=0;
  for(let i=0;i<labels.length;i++){
    const nm=String(labels[i]==null?'':labels[i]).trim();
    const row=dgrid[i]||[];
    const nReal=headers.reduce((n,_,c)=>n+(isRealNum(row[c])?1:0),0);
    if(nReal===0||!nm) continue;
    if(lines[li]){
      lines[li].row=headerRowIdx+2+i; /* 1-based sheet row */
      lines[li].formula=fcol[i]||'';
    }
    li++;
  }
  return { name:data.spreadsheet||'', headers, lines,
    detected:{ labelCol:numToCol(labelColIdx+1), headerRow:headerRowIdx+1, firstCol:numToCol(firstColIdx+1), months, tab:src.tab||'' },
    formulasAvailable:!!fgrid };
}
async function readSource(src){
  const rowsCap=300;
  const lastCol=numToCol(colToNum(src.firstCol)+Math.max(1,src.months)-1);
  const qt = src.tab ? ((/[^A-Za-z0-9_]/.test(src.tab)?`'${src.tab}'`:src.tab)+'!') : '';
  const rL=`${qt}${src.labelCol}${src.headerRow+1}:${src.labelCol}${src.headerRow+rowsCap}`;
  const rH=`${qt}${src.firstCol}${src.headerRow}:${lastCol}${src.headerRow}`;
  const rD=`${qt}${src.firstCol}${src.headerRow+1}:${lastCol}${src.headerRow+rowsCap}`;
  let data;
  try{ data=await gasReadRanges([rL,rH,rD],{ssid:src.ssid||'', includeFormulas:true}); }
  catch(e){ data=await gasReadRanges([rL,rH,rD],{ssid:src.ssid||'', includeFormulas:false}); }
  const labels=(data.values[rL]||[]).map(r=>String(r[0]==null?'':r[0]).trim());
  const headers=((data.values[rH]||[])[0]||[]).map(h=>String(h==null?'':h).trim());
  const grid=data.values[rD]||[];
  const fgrid=(data.formulas&&data.formulas[rD])||null;
  const lines=parseLines(labels,headers,grid);
  let li=0;
  for(let i=0;i<labels.length;i++){
    const nm=String(labels[i]==null?'':labels[i]).trim();
    const row=grid[i]||[];
    const nReal=headers.reduce((n,_,c)=>n+(isRealNum(row[c])?1:0),0);
    if(nReal===0||!nm) continue;
    if(lines[li]){
      lines[li].row=src.headerRow+1+i;
      lines[li].formula=fgrid?String((fgrid[i]&&fgrid[i][0])||'').trim():'';
    }
    li++;
  }
  return {name:data.spreadsheet||'', headers, lines, formulasAvailable:!!fgrid};
}

/* read both files, auto-match by label, rebuild the model as read-lines */
async function doImport(fSrc,aSrc){
  const F=await readSource(fSrc);
  const A=aSrc&&aSrc.ssid?await readSource(aSrc):{headers:[],lines:[]};
  const fHead=F.headers.map(fmtPeriodLabel), aHead=A.headers.map(fmtPeriodLabel);
  const periods=fHead.map((h,i)=>h||('P'+(i+1)));
  const aHeadIdx={}; aHead.forEach((h,i)=>{ aHeadIdx[nrm(h)]=i; });
  const alignA=series=>periods.map((h,pi)=>{ const ai=aHeadIdx[nrm(h)]; const v=(ai!=null?series[ai]:series[pi]); return v===undefined?null:v; });
  // identity = metric (section) + account name — so "Meridian Retail" in Revenue and in Gross Margin are two lines
  const idOf=l=>nrm(l.metric||'')+'|'+nrm(l.name);
  const aById={}, aMetaById={}; A.lines.forEach(l=>{ aById[idOf(l)]=alignA(l.series); });
  const fById={}, metaById={}; F.lines.forEach(l=>{ fById[idOf(l)]=l.series; metaById[idOf(l)]={name:l.name,metric:l.metric}; });
  A.lines.forEach(l=>{ if(!metaById[idOf(l)]) metaById[idOf(l)]={name:l.name,metric:l.metric}; });
  const order=[]; const seen=new Set();
  F.lines.forEach(l=>{ const id=idOf(l); if(!seen.has(id)){ order.push(id); seen.add(id); } });
  A.lines.forEach(l=>{ const id=idOf(l); if(!seen.has(id)){ order.push(id); seen.add(id); } });
  const oldByAcct={}; model.vars.forEach(v=>{ if(v.account!=null) oldByAcct[nrm(v.metric||'')+'|'+nrm(v.account)]=v; });
  const keep=model.vars.filter(v=>!(v.srcLine||(v.kind==='output'&&v.account!=null)));
  const usedK={}; keep.forEach(v=>{ usedK[v.key]=1; });
  const uk=name=>{ let k=slugKey(name),b=k,i=2; while(usedK[k]){k=b+'_'+i;i++;} usedK[k]=1; return k; };
  let matched=0;
  /* Build line list from forecast (preferred) with formulas when available */
  const fLineById={}; F.lines.forEach(l=>{ fLineById[idOf(l)]=l; });
  const provisional=order.map(id=>{
    const meta=metaById[id]||{name:id,metric:''};
    const name=meta.name, metric=meta.metric||'';
    const prev=oldByAcct[id];
    const key=(prev&&prev.key&&!usedK[prev.key])?prev.key:uk((metric?metric+'_':'')+name);
    usedK[key]=1;
    const fl=fLineById[id];
    return {id,name,metric,key,prev,row:fl&&fl.row,formula:fl&&fl.formula,l:fl};
  });
  const cellMap=buildCellMapFromScan({sheet:fSrc.tab||'', firstCol:fSrc.firstCol||'B', lines:provisional.map(p=>({key:p.key,row:p.row,name:p.name,metric:p.metric}))});
  const fakeLines=provisional.map(p=>({name:p.name,metric:p.metric,series:(fById[p.id]||[]),formula:p.formula||'',row:p.row}));
  const classes=classifyLinesFromFormulas(fakeLines, cellMap, fSrc.tab||'', true);
  let nForm=0;
  const newOutputs=provisional.map((p,idx)=>{
    const fs=fById[p.id], as=aById[p.id];
    const fser=fs?periods.map((_,pi)=>fs[pi]===undefined?null:fs[pi]):null;
    const aser=as||null;
    if(fs&&as&&as.some(x=>x!=null)) matched++;
    const cls=Object.assign({}, classes[idx]||{kind:'output',mapStatus:'unmapped',confidence:'low'});
    /* actuals-only lines stay output */
    if(!fs && as){ cls.kind='output'; }
    const range=p.row?buildRange(fSrc.tab||'', fSrc.firstCol||'B', p.row, periods.length):'';
    const aLine=A.lines.find(l=>nrm(l.metric||'')+'|'+nrm(l.name)===p.id);
    const actualRange=(aLine&&aLine.row&&aSrc)?buildRange(aSrc.tab||'', aSrc.firstCol||'B', aLine.row, periods.length):'';
    const v={key:p.key,name:p.name,metric:p.metric,account:p.name,forecast:fser,actuals:aser,read:fser,srcLine:true,range:range||''};
    if(actualRange) v.actualRange=actualRange;
    applyClassifyToVar(v, cls);
    demoteConfirmedWithoutRange(v);
    if(cls.kind==='formula'){ v.expr=cls.expr; v.sheetFormula=cls.sheetFormula||''; nForm++; }
    else if(cls.kind==='input'){
      v.writable=true; const series=fser||[]; v.base=(series.find(x=>x!=null)!=null?Number(series.find(x=>x!=null)):0); v.steps=[]; v.delta=0;
      for(let i=1;i<series.length;i++) if(series[i]!=null&&series[i-1]!=null&&Math.abs(series[i]-series[i-1])>1e-9) v.steps.push({from:i,value:series[i]});
    } else if(cls.sheetFormula) v.sheetFormula=cls.sheetFormula;
    const prev=p.prev||{};
    ['good','favOverride','agg','group','solveMode','solveDriver','pins'].forEach(pp=>{ if(prev[pp]!==undefined) v[pp]=prev[pp]; });
    if(prev.kind==='formula' && prev.expr && cls.kind!=='formula'){ v.kind='formula'; v.expr=prev.expr; v.mapStatus=prev.mapStatus||'manual'; }
    if(prev.mapStatus==='manual' && prev.range){ v.range=prev.range; v.mapStatus='manual'; }
    return v;
  });
  if(!newOutputs.length) throw new Error('No line items found — check the label column and header row');
  model.vars=keep.concat(newOutputs); model.periods=periods; model.closed=lastActualIdx()+1;
  model.sources={forecast:fSrc,actual:aSrc};
  if(!model.displayVars||!model.displayVars.filter(k=>vget(k)).length) model.displayVars=[(newOutputs.find(v=>v.kind==='formula')||newOutputs[newOutputs.length-1]||keep[keep.length-1]||{}).key].filter(Boolean);
  if(!vget(_vState.line)) _vState.line=null; if(!vget(_cState.line)) _cState.line=null;
  _vState.userVer=false; _vState.winUser=false;
  try{delete sessionStorage.__vinit;}catch(e){}
  recompileAll(); saveModel(); saveConn();
  return {total:newOutputs.length, matched, kept:keep.length, formulas:nForm};
}

const GRAPH_INGEST_VERSION=8;
function isStaleFakePnLInput(v){
  if(!v) return false;
  if(v.srcPricing) return false; /* Pricing controls are not P&L walk fakes */
  if(v.kind!=='input') return false;
  if(v.sheetFormula && String(v.sheetFormula).startsWith('=')) return false;
  /* Graph leaves on Assumptions/other tabs are real inputs — never "fake" */
  if(v.srcGraph && !v.srcLine) return false;
  const rng=String(v.range||'');
  const onPnL=/p\s*&\s*l|\bpnl\b/i.test(rng);
  /* Only P&L statement lines wrongly stored as Input (pre-walk / stale localStorage) */
  if(!onPnL && !v.srcLine) return false;
  const nm=String(v.name||'');
  if(!/revenue|cogs|gross|cost|margin|subscription|discount|credit|refund|ebitda|opex|cash|growth/i.test(nm)) return false;
  return true;
}
function staleGraphModel(){
  const fakes=(model.vars||[]).filter(isStaleFakePnLInput);
